<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="description" content="독일어 놀이터 · 독일어를 처음부터, 하루 5분. German for beginners, with Korean and English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독일어">
<title>독일어 놀이터 · Deutsch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ---------- 디자인 토큰 ---------- */
:root{
  --bg:#f4efe6; --surface:#ffffff; --surface2:#eee7d8; --ink:#23252b; --ink2:#5c6270;
  --line:#ddd5c4; --accent:#2f6fed; --accent-ink:#ffffff;
  --gold:#96700f; --ok:#1e7a45; --warn:#b3362c;
  --masc:#2456b0; --fem:#b02f45; --neu:#226b35;
  --hero:#e8efff; --hero-ink:#1c2a4a;
  --seq1:#a9c4ff; --seq2:#5e8ff5; --seq3:#1f4fc4;
  --r:17px;
  --font-d:'Jua',sans-serif; --font-b:'Gowun Dodum',sans-serif;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161c; --surface:#1e222b; --surface2:#262b36; --ink:#e9ecf2; --ink2:#a3acba;
    --line:#333a47; --accent:#6ea0ff; --accent-ink:#0f1218;
    --gold:#e0b45c; --ok:#5fc98a; --warn:#f0837a;
    --masc:#8fb4ff; --fem:#ff93a6; --neu:#84d69a;
    --hero:#22304a; --hero-ink:#e9ecf2;
    --seq1:#3d5a99; --seq2:#6ea0ff; --seq3:#c5d8ff;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;
  min-height:44px;min-width:44px;padding:8px 14px}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
button[disabled]{opacity:.45;cursor:default}
p{margin:8px 0}

/* ---------- 레이아웃 ---------- */
#app{max-width:560px;margin:0 auto;
  padding:var(--safe-t) max(16px,var(--safe-r)) calc(28px + var(--safe-b)) max(16px,var(--safe-l));word-break:keep-all}
main{display:block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink2);font-size:14px}
.tiny{color:var(--ink2);font-size:13px;margin:6px 0}
.de{font-size:19px}
.ko{font-size:14px;color:var(--ink2)}
.en{font-size:14px;color:var(--ink2)}
.tr{display:block;font-size:14px;color:var(--ink2)}
.meanbig .tr{font-size:17px;color:var(--ink)}
.meanbig .tr+.tr{color:var(--ink2)}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .22s ease}
  @keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
}

/* ---------- 헤더 ---------- */
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.top h1{font-family:var(--font-d);font-size:20px;margin:0;font-weight:400}
.vtitle{font-family:var(--font-d);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;white-space:nowrap}
.iconbtn{border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;padding:8px;flex:none}
.iconbtn svg{width:20px;height:20px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);font-size:15px;padding:8px 12px;flex:none}
.backbtn svg{width:18px;height:18px}

/* ---------- 홈 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:16px;margin:8px 0 12px}
.hero h2{font-family:var(--font-d);font-size:22px;margin:0 0 2px;font-weight:400}
.hero .muted{color:inherit;opacity:.8}
.bar{height:10px;border-radius:999px;background:rgba(127,127,127,.28);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(127,127,127,.14);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-weight:400;font-size:20px}
.stat b em{font-style:normal;font-size:14px;opacity:.75}
.stat span{font-size:12.5px;opacity:.85}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);
  border-radius:var(--r);padding:14px 16px;margin:10px 0}
.cta .cta-main{display:block;font-family:var(--font-d);font-size:19px}
.cta .cta-sub{display:block;font-size:13.5px;opacity:.92}
.cta svg{width:22px;height:22px;flex:none}
.cta.second{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.cta.second .cta-sub{color:var(--ink2);opacity:1}
.secttl{font-family:var(--font-d);font-size:18px;font-weight:400;margin:18px 0 6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.modebtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;display:flex;flex-direction:column;
  gap:2px;justify-content:center;min-height:70px;padding:10px 12px}
.modebtn b{font-family:var(--font-d);font-weight:400;font-size:16px}
.modebtn span{font-size:12.5px;color:var(--ink2)}
@media (max-width:330px){.modes{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;white-space:nowrap;padding:8px 14px;font-size:15px;flex:none}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .cnt{font-size:12px;opacity:.75;margin-left:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;min-height:60px}
.wrow .main{flex:1;min-width:0}
.wrow .w{font-size:18px;display:block;overflow-wrap:anywhere}
.wrow .m{font-size:13.5px;color:var(--ink2);display:block}
.wrow .side{flex:none;text-align:right}
.art{font-weight:700}
.g-m{color:var(--masc)} .g-f{color:var(--fem)} .g-n{color:var(--neu)}
.newtag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12px;color:var(--ink2)}
.duetag{display:inline-block;border:1px solid var(--gold);border-radius:8px;padding:1px 7px;font-size:12px;color:var(--gold)}
.stars{font-size:14px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.stars .off{color:var(--line)}
.pletter{font-family:var(--font-d);font-size:22px;min-width:64px;text-align:center;color:var(--accent);flex:none}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.link{color:var(--accent);text-decoration:underline;padding:8px 4px;min-width:0}
.danger{color:var(--warn)}

/* ---------- 단어 보기 · 기초 ---------- */
.wordhead{font-family:var(--font-d);font-size:30px;font-weight:400;margin:2px 0;overflow-wrap:anywhere}
.meanbig{font-size:18px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);margin:2px 4px 2px 0}
.exbox{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:10px 0}
.exbox .de{display:block}
.tipbox{border-left:4px solid var(--gold);padding:6px 10px;margin:10px 0;font-size:14.5px}
.tipbox .en{display:block}
.speakbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);padding:8px 14px;font-size:15px}
.speakbtn svg{width:19px;height:19px;flex:none}
.sayrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface2);border-radius:12px;padding:8px 12px;margin:6px 0}
.sayrow svg{width:20px;height:20px;flex:none;color:var(--accent)}
.sayrow .de{display:block}
.note p{margin:10px 0}
.note .en{display:block;margin-top:2px}

/* ---------- 게임 ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.qhead .tag{font-family:var(--font-d);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface)}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;background:var(--accent)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:8px 0}
.qword{font-family:var(--font-d);font-size:32px;font-weight:400;margin:6px 0 2px;overflow-wrap:anywhere}
.qmean{font-size:22px;margin:8px 0 2px}
.qsent{font-size:21px;line-height:1.9;margin:8px 0}
.blank{display:inline-block;min-width:70px;min-height:44px;border:0;border-bottom:3px solid var(--accent);border-radius:0;color:var(--ink2);
  text-align:center;padding:0 6px;margin:0 2px;font-size:inherit;vertical-align:baseline}
.blank.filled{color:var(--ink);background:var(--surface2);border-radius:8px 8px 0 0}
.blank.good{border-color:var(--ok);color:var(--ok)}
.blank.wrong{border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.chipbtn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 14px;font-size:17px}
.chipbtn[disabled]{opacity:.3}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;padding:11px 14px;font-size:17px;min-height:52px}
.opt.good{border-color:var(--ok);background:rgba(30,122,69,.12)}
.opt.wrong{border-color:var(--warn);background:rgba(179,54,44,.12)}
.opt[disabled]{opacity:1}
.opt[disabled]:not(.good):not(.wrong){opacity:.5}
.ansrow{display:flex;gap:8px;margin:14px 0 6px}
.ansrow button{flex:1;border:2px solid currentColor;border-radius:14px;background:var(--surface);font-family:var(--font-d);font-size:21px;padding:12px 4px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.fb.ok{background:rgba(30,122,69,.12);border:1px solid var(--ok)}
.fb.bad{background:rgba(179,54,44,.12);border:1px solid var(--warn)}
.primary{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;font-family:var(--font-d);font-size:18px;padding:12px;margin:12px 0 2px}
.ghost{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-family:var(--font-d);font-size:17px;padding:11px;margin:8px 0 2px}
.ghost svg{width:19px;height:19px;vertical-align:-4px;margin-right:4px}
.bigsay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px solid var(--accent);border-radius:var(--r);
  background:var(--surface2);color:var(--accent);font-family:var(--font-d);font-size:20px;padding:18px;margin:8px 0}
.bigsay svg{width:28px;height:28px}
.conj{border-collapse:collapse;margin:10px 0;font-size:16px}
.conj th{font-weight:400;color:var(--ink2);text-align:left;padding:4px 14px 4px 0;font-size:14.5px}
.conj td{padding:4px 0;font-size:17px}
.conj tr.hi th,.conj tr.hi td{color:var(--accent);font-weight:700}
.qpron{font-family:var(--font-d);font-size:28px;margin:6px 0 0}
.qpron .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);margin-left:8px;vertical-align:-4px}
.typein{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;margin:12px 0 6px}
.typein:focus{border-color:var(--accent);outline:none}
.umlauts{display:flex;gap:8px;margin:0 0 6px}
.umlauts button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:12px;font-size:20px;padding:6px}
.hint{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:var(--ink2)}
.oline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:58px;border:0;border-bottom:3px solid var(--accent);padding:6px 0;margin:12px 0 4px;font-size:18px}
.oline .chipbtn{background:var(--surface);border-color:var(--accent)}
.oline.good{border-color:var(--ok)} .oline.wrong{border-color:var(--warn)}
.oline .end{font-size:20px}
.done{border:1px solid var(--ok);background:rgba(30,122,69,.10);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- 기록 탭 ---------- */
.maintabs{display:flex;gap:6px;margin:2px 0 10px}
.maintabs button{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--font-d);font-size:16px;padding:8px 4px}
.maintabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.people{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px}
.person[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.person.add{border-style:dashed;color:var(--ink2)}
.stats.four{grid-template-columns:repeat(4,1fr)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:112px;margin:10px 0 0}
.week.empty{height:20px}
.week .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}
.week .v{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.week .b{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0}
.week .b.zero{background:var(--line);height:2px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12.5px;color:var(--ink2);
  border-top:1px solid var(--line);padding-top:4px}
.weekdays .now{color:var(--ink);font-weight:700}
.meter{display:grid;grid-template-columns:52px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:14.5px}
.meter .track{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter .n{color:var(--ink2);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden;margin:10px 0 8px}
.stack i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.legend b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.s0{background:var(--line)} .s1{background:var(--seq1)} .s2{background:var(--seq2)} .s3{background:var(--seq3)}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th{font-weight:400;color:var(--ink2);font-size:12.5px;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
.cmp td{text-align:right;padding:9px 5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp tr:last-child td{border-bottom:0}
.cmp th:first-child,.cmp td:first-child{text-align:left;overflow-wrap:anywhere}
.cmp tr.me td:first-child{font-weight:700}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}

/* ---------- 시트 (결과 · 사용법) · 알림 ---------- */
.sheetwrap{position:fixed;inset:0;background:rgba(15,17,22,.55);display:grid;place-items:end center;z-index:20;
  padding:16px 16px calc(20px + var(--safe-b))}
.sheet{width:100%;max-width:528px;max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px}
.sheet h3{font-family:var(--font-d);font-size:22px;font-weight:400;margin:0 0 4px}
.sheet .stars{font-size:26px}
.xpline{font-size:17px;margin:8px 0 2px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow button{flex:1;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));z-index:30;max-width:min(520px,calc(100vw - 32px));
  background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14.5px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
/* ---------- 데이터 ---------- */
/* 뜻과 설명은 한국어(ko)와 영어(en) 둘 다 있어요. 독일어 문장은 모두 사람이 확인한 것만 넣어요. */
const TOPICS=['기초','인사','표현','숫자','가족','동사','질문','작은 말','음식','집','시간','일상','여행'];
const TOPIC_EN={'기초':'Basics','인사':'Greetings','표현':'Phrases','숫자':'Numbers','가족':'Family','동사':'Verbs','질문':'Questions','작은 말':'Small words','음식':'Food','집':'Home','시간':'Time','일상':'Daily life','여행':'Travel'};
const PHONICS=[
 {id:'p1',de:'ä',ko:'"에" 소리. 입을 조금 더 벌려요',en:'like the e in "bed"',
  words:[{de:'Käse',ko:'치즈',en:'cheese'},{de:'Mädchen',ko:'소녀',en:'girl'},{de:'Äpfel',ko:'사과들',en:'apples'}]},
 {id:'p2',de:'ö',ko:'"에"를 말하면서 입술을 "오"처럼 둥글게',en:'say "eh" with rounded lips, like British "bird"',

const PATH=[1,8,9,12,13, 301,232,201,319,6, 205,302,404,206,403, 2,3,4,5,7, 11,407,10,304,305, 202,402,401,211,306, 22,23,24,25,26, 207,203,307,308,309];

function verbOf(w){return w&&w.pos==='v'?VERBS.find(v=>v.inf===w.de)||null:null;}
/* 동사 변화 표를 한 번에 읽어 주는 글 (녹음 하나) */
function conjText(v){return ['ich','du','er','wir','ihr','sie'].map((p,i)=>p+' '+v.praes[i]).join(', ');}
/* 녹음 파일 이름: 읽을 글의 FNV-1a(UTF-8) 16진수 8자리. dev/make_clips.py 가 같은 식으로 만들어요. */
function sayText(t){return String(t||'').replace(/[’‘]/g,"'").replace(/…/g,' ').replace(/\s+/g,' ').trim();}
function akey(t){
  const b=new TextEncoder().encode(sayText(t));let h=0x811c9dc5;
  for(let i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,0x01000193)>>>0;}
  return ('0000000'+h.toString(16)).slice(-8);}
/* 앱이 소리 내어 읽는 모든 글 (녹음 만들 때 dev/audio_texts.js 가 불러요) */
function allSpeech(){
  const set=new Set();const add=t=>{t=sayText(t);if(t)set.add(t);};
  PHONICS.forEach(p=>p.words.forEach(x=>add(x.de)));
  NOTES.forEach(n=>n.ex.forEach(x=>add(x.de)));
  WORDS.forEach(w=>{add(w.de);if(w.pl)add(w.pl);add(w.ex);});
  VERBS.forEach(v=>add(conjText(v)));
  SENTENCES.forEach(s=>add(s.de));
  return Array.from(set);}

const $=(s,el)=>(el||document).querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(day,n){const p=day.split('-').map(Number);return todayStr(new Date(p[0],p[1]-1,p[2]+n));}
function dayDiff(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}

function load(){

        for(const d of Object.keys(s.days)){const x=s.days[d];if(!DAY_RE.test(d)||!x||typeof x!=='object'){delete s.days[d];continue;}
          for(const k of ['x','g','n','c'])if(typeof x[k]!=='number'||!(x[k]>=0))x[k]=0;}

        return s;

  return blank();

/* LV_AT[L-1] = 레벨 L이 되는 XP. 10레벨 뒤로는 한 단계마다 100 XP씩 더 필요해요. */
const LV_AT=(function(){const a=[0,120,300,550,900,1350,1900,2600,3400,4300];let step=1000;
  while(a.length<40){a.push(a[a.length-1]+step);step+=100;}return a;})();
const LV_TITLES=[null,
 'Anfänger 새내기','Hamburg 항구','Berlin 큰 도시','Köln 대성당','Rhein 강가','Heidelberg 성',
 'München 광장','Alpen 산길','Wien 카페','Zürich 호수','Frankfurt 빌딩 숲','Neuschwanstein 성',
 'Dresden 옛 시가지','Leipzig 음악의 도시','Schwarzwald 검은 숲','Bodensee 호수','Salzburg 모차르트의 도시',
 'Bern 시계탑','Lübeck 항구의 문','Brandenburger Tor 문'];
function lvl(xp){let L=1;while(L<LV_AT.length&&xp>=LV_AT[L])L++;return L;}
function lvlInfo(xp){const L=lvl(xp),lo=LV_AT[L-1],hi=LV_AT[L];
  return {L:L,need:hi===undefined?0:hi-xp,pct:hi===undefined?100:Math.max(0,Math.min(100,Math.round((xp-lo)/(hi-lo)*100)))};}

/* ---------- 소리 ---------- */
/* 읽어 주기: 녹음(audio/<key>.mp3)이 있으면 그것을, 없으면 기기에서 가장 좋은 독일어 음성을 써요. */
let ac=null;
function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();
  if(ac.state==='suspended'&&ac.resume)ac.resume();}catch(e){}}
function tone(f,t0,d,type,g){const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  gn.gain.setValueAtTime(g||.08,ac.currentTime+t0);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+d);
  o.connect(gn);gn.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.03);}
function sfx(k){if(!S.sound||!ac)return;try{
  if(k==='ok'){tone(660,0,.12);tone(990,.07,.16);}
  else if(k==='bad'){tone(170,0,.24,'triangle',.12);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28));}
}catch(e){}}
const canSpeak=(typeof window!=='undefined')&&('speechSynthesis' in window);
let player=null,audioOff=(typeof Audio==='undefined'),audioHit=0,audioMiss=0,warnedVoice=false;
function deVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang||''));
  /* 새 신경망 음성(Google, Natural, Premium, Enhanced)이 기본 음성보다 훨씬 자연스러워요 */
  const score=v=>(/premium|enhanced|natural|neural|google|siri/i.test(v.name||'')?4:0)+(/^de[-_]DE/i.test(v.lang)?2:0)+(v.localService?0:1);
  return vs.sort((a,b)=>score(b)-score(a))[0]||null;}
/* onEnd(true) = 끝까지 읽었음, onEnd(false) = 소리를 낼 수 없었음 (연속 듣기가 써요) */
function tts(t,onEnd){
  if(!canSpeak){noVoice();if(onEnd)onEnd(false);return;}
  try{
    const all=speechSynthesis.getVoices(),v=deVoice();
    if(all.length&&!v){noVoice();if(onEnd)onEnd(false);return;}   /* 다른 언어 음성으로 독일어를 읽히지 않아요 */
    const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.88;if(v)u.voice=v;
    if(onEnd){u.onend=()=>onEnd(true);u.onerror=()=>onEnd(false);}
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){if(onEnd)onEnd(false);}}
function noVoice(){if(warnedVoice)return;warnedVoice=true;
  toast('이 기기에는 독일어 음성이 없어요. 녹음 파일(audio 폴더)이 있는 곳에서 열면 소리가 나요.');}
function stopSay(){try{if(player){player.pause();player=null;}if(canSpeak)speechSynthesis.cancel();}catch(e){}}
/* 목소리 두 가지: 여자(audio/) 와 낮은 남자 목소리(audio/m/). 남자 녹음이 없으면 여자 녹음, 그것도 없으면 기기 음성. */
function clipUrl(t,v){return (v==='m'?'audio/m/':'audio/')+akey(t)+'.mp3';}
function say(text,onEnd){
  const t=sayText(text);if(!t){if(onEnd)onEnd(false);return;}
  stopSay();
  if(audioOff){tts(t,onEnd);return;}
  playClip(S.voice==='m'?[clipUrl(t,'m'),clipUrl(t,'f')]:[clipUrl(t,'f')],0,t,onEnd);}
function playClip(urls,i,t,onEnd){
  let a;try{a=new Audio(urls[i]);}catch(e){audioOff=true;tts(t,onEnd);return;}
  player=a;let settled=false;
  const miss=()=>{if(settled)return;settled=true;
    if(player!==a)return;                         /* 그 사이 다른 소리를 틀었거나 멈췄어요 */
    player=null;
    if(i+1<urls.length){playClip(urls,i+1,t,onEnd);return;}
    if(!audioHit&&++audioMiss>=3)audioOff=true;   /* 녹음이 아예 없는 곳: 그 뒤로는 바로 기기 음성 */
    tts(t,onEnd);};
  a.addEventListener('error',miss);
  a.addEventListener('playing',()=>{settled=true;audioHit++;});
  if(onEnd)a.addEventListener('ended',()=>onEnd(true));
  try{const p=a.play();
    if(p&&p.catch)p.catch(e=>{const n=e&&e.name;
      if(n==='AbortError'||n==='NotAllowedError'){settled=true;if(onEnd&&n==='NotAllowedError')onEnd(false);return;}
      miss();});
  }catch(e){miss();}}
function autoSay(text){if(S.sound)say(text);}   /* 소리 끄기 = 효과음과 자동 읽기 끄기. 듣기 버튼은 항상 돼요 */
if(canSpeak){try{speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
let toastEl=null,toastT=null;
function toast(msg){try{
  if(!toastEl){toastEl=document.createElement('div');toastEl.className='toast';toastEl.setAttribute('role','status');document.body.appendChild(toastEl);}
  toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.hidden=true;},4200);
}catch(e){}}

/* ---------- 연속 듣기: 배운 단어와 예문을 차례로 읽어 주는 작은 플레이어 ---------- */
let PL={on:false,list:[],i:0,step:0,tk:0};
function plStop(){PL.on=false;PL.tk++;}
function plStart(){
  const list=learnedIn(scopeWords());
  if(!list.length){toast('먼저 "오늘 배우기"로 단어를 배워요.');return;}
  clearTimers();stopSay();G=null;
  PL={on:true,list:list,i:0,step:0,tk:0};
  view={name:'listen'};render();window.scrollTo(0,0);plPlay();
}
function plPlay(){
  if(!PL.on)return;
  const w=PL.list[PL.i],tk=++PL.tk;
  say(PL.step?w.ex:w.de,ok=>{
    if(!PL.on||tk!==PL.tk)return;
    if(!ok){plStop();render();toast('소리를 낼 수 없어서 연속 듣기를 멈췄어요.');return;}
    timers.push(setTimeout(()=>{
      if(!PL.on||tk!==PL.tk)return;
      if(PL.step===0)PL.step=1;
      else{PL.step=0;PL.i++;if(PL.i>=PL.list.length){PL.i=PL.list.length-1;PL.end=true;plStop();render();return;}}
      render();plPlay();
    },PL.step?1500:700));
  });
}
function plJump(d){
  if(!PL.list.length)return;
  const was=PL.on;plStop();clearTimers();stopSay();
  PL.i=Math.max(0,Math.min(PL.list.length-1,PL.i+d));PL.step=0;PL.end=false;PL.on=was;
  render();plPlay();
}

    +'<button class="ghost" data-act="plnext"'+(PL.i<n-1?'':' disabled')+'>다음 단어</button></div>';

/* ---------- 계정 저장 (SYNC_URL 이 있을 때만 보여요) ---------- */
/* 서버에는 사람마다 작은 JSON 하나: {v, at, s: 진도, pub: 요약}. 두 기기의 진도는 mergeState 로 합쳐요. */
const BOARD_KEY=KEY+'-board';
const SYNC_FIELDS=['xp','streak','lastDay','today','items','days','seen','diff','lang','voice','topic','sound','rz'];
let sync={busy:false,again:false,dirty:false,t:null,err:'',at:0,board:null};
try{const b=JSON.parse(localStorage.getItem(BOARD_KEY)||'null');if(Array.isArray(b))sync.board=b;}catch(e){}
function canSync(){return !!(SYNC_URL&&S.acct&&S.acct.code&&typeof fetch==='function');}
function syncSoon(){sync.dirty=true;if(!canSync()||sync.t)return;
  sync.t=setTimeout(()=>{sync.t=null;if(sync.dirty)syncNow();},20000);}
function clearBoard(){sync.board=null;sync.err='';sync.at=0;sync.dirty=false;try{localStorage.removeItem(BOARD_KEY);}catch(e){}}
/* 한 사람의 요약: 기록 탭의 표와 서버의 pub 에 같이 써요 */
function summary(s){
  const items=(s&&s.items)||{},days=(s&&s.days)||{},t=todayStr();let words=0,stars=0,week=0;
  for(const k of Object.keys(items)){const it=items[k];
    if(it&&it.n>0&&byId(Number(k))){words++;stars+=it.box>=5?3:it.box>=3?2:it.box>=1?1:0;}}
  for(let i=0;i<7;i++){const d=days[addDays(t,-i)];if(d&&d.x>0)week+=d.x;}
  const day=(s&&typeof s.lastDay==='string'&&DAY_RE.test(s.lastDay))?s.lastDay:'',gap=day?dayDiff(day,t):99,xp=(s&&s.xp>0)?Math.floor(s.xp):0;
  return {xp:xp,lv:lvl(xp),streak:(gap===0||gap===1)?(s.streak||0):0,words:words,stars:stars,week:week,day:day};}
function packState(){const s={};SYNC_FIELDS.forEach(k=>{s[k]=S[k];});
  return {v:1,app:'deutsch',at:S.updatedAt,s:s,pub:Object.assign({name:S.acct.name},summary(S))};}
function isFresh(s){return !s.xp&&!s.rz&&!Object.keys(s.items).length;}
function cleanItem(r){const n=x=>(typeof x==='number'&&x>=0)?x:0;
  const it={box:Math.min(5,Math.floor(n(r.box))),due:typeof r.due==='string'?r.due:'',n:Math.floor(n(r.n)),c:Math.floor(n(r.c)),
    up:typeof r.up==='string'?r.up:'',last:n(r.last)};
  if(n(r.miss))it.miss=Math.floor(n(r.miss));
  return it;}
/* 서버의 진도 R 을 이 기기의 진도 L 에 합쳐요. 단어마다 더 나중에 푼 쪽, 날짜마다 더 큰 쪽.
   "진도 초기화"(rz)는 더 나중에 한 쪽이 이겨요. adopt = 새 기기라서 설정도 서버 것을 받아요. */
function mergeState(L,R,adopt){
  if(!R||typeof R!=='object')return L;
  const num=x=>(typeof x==='number'&&x>=0)?Math.floor(x):0,rz=num(R.rz);
  if(rz<(L.rz||0))return L;
  if(rz>(L.rz||0)){L.items={};L.days={};L.seen={};L.xp=0;L.streak=0;L.lastDay=null;L.today={day:null,games:0};L.rz=rz;}
  if(R.items&&typeof R.items==='object')for(const k of Object.keys(R.items)){const r=R.items[k];
    if(!r||typeof r!=='object'||!byId(Number(k)))continue;
    const l=L.items[k];if(!l||num(r.last)>(l.last||0))L.items[k]=cleanItem(r);}
  if(R.days&&typeof R.days==='object')for(const d of Object.keys(R.days)){const r=R.days[d];
    if(!DAY_RE.test(d)||!r||typeof r!=='object')continue;
    const l=L.days[d]||(L.days[d]={x:0,g:0,n:0,c:0});
    for(const f of ['x','g','n','c'])l[f]=Math.max(l[f]||0,num(r[f]));}
  L.xp=Math.max(L.xp||0,num(R.xp));
  const rd=(typeof R.lastDay==='string'&&DAY_RE.test(R.lastDay))?R.lastDay:null;
  if(rd&&(!L.lastDay||rd>L.lastDay)){L.lastDay=rd;L.streak=num(R.streak);}
  else if(rd&&rd===L.lastDay)L.streak=Math.max(L.streak||0,num(R.streak));
  if(R.today&&typeof R.today==='object'&&R.today.day===todayStr()){
    if(L.today.day===R.today.day){L.today.games=Math.max(L.today.games||0,num(R.today.games));L.today.nw=Math.max(L.today.nw||0,num(R.today.nw));}
    else L.today={day:R.today.day,games:num(R.today.games),nw:num(R.today.nw)};}
  if(R.seen&&typeof R.seen==='object')for(const k of Object.keys(R.seen))if(R.seen[k])L.seen[k]=true;
  if(adopt){
    if([1,2,3].includes(R.diff))L.diff=R.diff;
    if(['both','ko','en'].includes(R.lang))L.lang=R.lang;
    if(R.voice==='m'||R.voice==='f')L.voice=R.voice;
    if(TOPICS.includes(R.topic))L.topic=R.topic;
    if(typeof R.sound==='boolean')L.sound=R.sound;}
  return L;}
/* 받아서 합치고 올리기. 그 사이 다른 기기가 올렸으면(412) 다시 받아서 합쳐요. true 또는 알림 글을 돌려줘요. */
async function syncOnce(st){
  const url=SYNC_URL+'/v1/p/'+st.acct.code;
  for(let n=0;n<3;n++){
    const g=await fetch(url,{cache:'no-store'});
    if(S!==st)return 'stale';
    let etag=null;
    if(g.status===200){etag=g.headers.get('ETag');const d=await g.json();
      if(S!==st)return 'stale';
      if(d&&d.s){mergeState(S,d.s,isFresh(S));store();}}
    else if(g.status!==404)return '서버가 바빠요 ('+g.status+'). 잠시 뒤 다시 저장돼요.';
    const h={'Content-Type':'application/json'};
    if(etag)h['If-Match']=etag;else h['If-None-Match']='*';
    const p=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify(packState()),keepalive:true});
    if(S!==st)return 'stale';
    if(p.status===204)return true;
    if(p.status===404)return '계정을 찾을 수 없어요. 연결을 끊고 다시 로그인해 주세요.';
    if(p.status!==412)return '서버가 바빠요 ('+p.status+'). 잠시 뒤 다시 저장돼요.';
  }
  return '다른 기기와 겹쳤어요. 잠시 뒤 다시 저장돼요.';}
async function syncNow(){
  if(!canSync())return false;
  if(sync.busy){sync.again=true;return false;}
  sync.busy=true;sync.again=false;sync.dirty=false;
  const st=S;let r;
  try{r=await syncOnce(st);}catch(e){r='서버에 연결하지 못했어요.';}
  sync.busy=false;
  if(S===st){
    if(r===true){sync.err='';sync.at=Date.now();}else{sync.err=r;sync.dirty=true;}
    if((view.name==='home'||view.name==='rec')&&!ui.sheet&&ui.tour===null)render();}
  if(sync.again||S!==st){sync.again=false;return syncNow();}
  return r===true;}
async function loadBoard(){
  if(!canSync())return;
  const st=S;
  try{const r=await fetch(SYNC_URL+'/v1/board/'+st.acct.code,{cache:'no-store'});
    if(r.status!==200||S!==st)return;
    const d=await r.json();
    if(S!==st||!d||!Array.isArray(d.rows))return;
    sync.board=d.rows.slice(0,20);
    try{localStorage.setItem(BOARD_KEY,JSON.stringify(sync.board));}catch(e){}
    if(view.name==='rec'&&!ui.sheet&&ui.tour===null)render();
  }catch(e){}}
function refreshRec(){if(canSync())syncNow().then(loadBoard);}
async function acctSubmit(){
  const sh=ui.sheet;if(!sh||sh.kind!=='acct'||sh.busy||!SYNC_URL)return;
  const ne=$('#acName'),pe=$('#acPin');
  const name=String((ne&&ne.value)||'').replace(/\s+/g,' ').trim(),pin=String((pe&&pe.value)||'').trim();
  if(name.length<2||name.length>10||/[<>]/.test(name)){toast('이름은 2~10자로 써 주세요.');return;}
  if(!/^[0-9]{4,6}$/.test(pin)){toast('PIN은 숫자 4~6자리예요.');return;}
  sh.busy=true;const st=S;let r;
  try{r=await fetch(SYNC_URL+'/v1/'+sh.mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,pin:pin})});}
  catch(e){sh.busy=false;toast('서버에 연결하지 못했어요. 인터넷을 확인해 주세요.');return;}
  sh.busy=false;
  if(S!==st||ui.sheet!==sh)return;
  if(r.status===200||r.status===201){
    let d=null;try{d=await r.json();}catch(e){}
    if(S!==st||!d||typeof d.code!=='string'){toast('서버의 답을 읽지 못했어요. 다시 해 주세요.');return;}
    S.acct={name:String(d.name||name),code:d.code};
    if(!me().name){me().name=S.acct.name.slice(0,10);saveWho();}
    store();ui.sheet=null;render();
    toast(r.status===201?'계정을 만들었어요. 이제 진도가 계정에도 저장돼요.':'로그인했어요. 진도를 맞추고 있어요.');
    syncNow().then(loadBoard);return;}
  const why={400:'이름이나 PIN을 다시 확인해 주세요.',401:'PIN이 맞지 않아요.',404:'그런 이름의 계정이 없어요. 처음이면 "새로 만들기"를 눌러요.',
    409:'이미 있는 이름이에요. 내 계정이면 "로그인"을 눌러요.',429:'너무 여러 번 했어요. 10분 뒤에 다시 해 주세요.',507:'계정 자리가 다 찼어요.'};
  toast(why[r.status]||'잘 안 됐어요 ('+r.status+'). 잠시 뒤 다시 해 주세요.');}

/* ---------- 백업 파일 ---------- */
function backupData(){const s={};SYNC_FIELDS.forEach(k=>{s[k]=S[k];});
  return {v:1,app:'deutsch',kind:'backup',name:nameOf(me()),at:Date.now(),s:s};}
function backupSave(){
  try{
    const d=backupData(),blob=new Blob([JSON.stringify(d)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='deutsch-'+String(d.name).replace(/[^0-9A-Za-z가-힣_-]/g,'')+'-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove();}catch(e){}},2000);
    S.bk=Date.now();store();render();toast('백업 파일을 저장했어요. 다운로드 폴더(파일 앱)에 있어요.');
  }catch(e){toast('이 브라우저에서는 파일을 저장하지 못했어요.');}}
/* 백업을 지금 사람의 기록에 합쳐요. 합친 뒤 배운 단어 수, 또는 알림 글을 돌려줘요. */
function importBackup(d){
  if(!d||typeof d!=='object'||d.app!=='deutsch'||!d.s||typeof d.s!=='object')return '독일어 놀이터의 백업 파일이 아니에요.';
  const R=Object.assign({},d.s,{rz:S.rz||0});
  mergeState(S,R,isFresh(S));save();
  return learnedIn(WORDS).length;}
function backupRead(file){
  if(!file)return;
  if(file.size>2000000){toast('파일이 너무 커요.');return;}
  const r=new FileReader();
  r.onload=()=>{let d=null;try{d=JSON.parse(String(r.result));}catch(e){}
    const n=importBackup(d);
    if(typeof n==='string'){toast(n);return;}
    render();toast((d.name?esc(d.name)+' 님의 ':'')+'백업을 불러왔어요. 배운 단어 '+n+'개.');};
  r.onerror=()=>toast('파일을 읽지 못했어요.');
  r.readAsText(file);}

function peek(id){try{const o=JSON.parse(localStorage.getItem(skey(id))||'null');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{};}catch(e){return {};}}
function switchPerson(id){
  if(id===WHO.cur||!WHO.list.some(p=>p.id===id))return;
  store();WHO.cur=id;saveWho();S=load();clearBoard();
  go({name:'rec'});toast(me().name?me().name+' 님으로 바꿨어요.':'첫 번째 사람의 기록으로 바꿨어요.');refreshRec();}
function whoSave(){
  const sh=ui.sheet;if(!sh||sh.kind!=='who')return;
  const el=$('#whoName'),name=String((el&&el.value)||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,10);
  if(!name){toast('이름을 써 주세요.');return;}
  if(WHO.list.some(p=>p.id!==sh.id&&p.name===name)){toast('같은 이름이 이미 있어요.');return;}
  if(sh.id){const p=WHO.list.find(x=>x.id===sh.id);if(p)p.name=name;saveWho();ui.sheet=null;render();return;}
  if(WHO.list.length>=6)return;
  store();
  const id='p'+Date.now().toString(36).slice(-7)+Math.floor(Math.random()*36).toString(36);
  WHO.list.push({id:id,name:name});WHO.cur=id;saveWho();
  S=Object.assign(blank(),{lang:S.lang,sound:S.sound});store();clearBoard();
  go({name:'rec'});toast(name+' 님, 환영해요! "배우기" 탭에서 시작해요.');}
function whoDel(){
  const sh=ui.sheet;if(!sh||sh.kind!=='who'||!sh.id||WHO.list.length<2)return;
  if(!sh.sure){sh.sure=true;render();return;}
  if(WHO.cur!==sh.id)store();
  try{localStorage.removeItem(skey(sh.id));}catch(e){}
  WHO.list=WHO.list.filter(p=>p.id!==sh.id);
  if(WHO.cur===sh.id){WHO.cur=WHO.list[0].id;S=load();clearBoard();}
  saveWho();go({name:'rec'});toast('이 기기에서 지웠어요.');refreshRec();}
/* 함께 배우기 표: 이 기기의 사람들 + (계정이 있으면) 다른 기기에서 배우는 가족 */
function peopleRows(){
  const rows=[],mine={},t=todayStr();
  for(const p of WHO.list){const s=p.id===WHO.cur?S:peek(p.id);
    rows.push(Object.assign(summary(s),{name:nameOf(p),me:p.id===WHO.cur}));
    if(s.acct&&typeof s.acct.name==='string')mine[s.acct.name]=true;}
  if(canSync()&&sync.board)for(const r of sync.board){
    if(!r||r.me||typeof r.name!=='string'||mine[r.name])continue;
    const day=(typeof r.day==='string'&&DAY_RE.test(r.day))?r.day:'',gap=day?dayDiff(day,t):99,n=x=>(typeof x==='number'&&x>=0)?Math.floor(x):0;
    rows.push({name:r.name.slice(0,10),me:false,xp:n(r.xp),lv:lvl(n(r.xp)),words:n(r.words),stars:n(r.stars),
      streak:gap<=1?n(r.streak):0,week:gap<7?n(r.week):0,day:day});}
  return rows.sort((a,b)=>b.xp-a.xp);}

/* ---------- 단어 보기 ---------- */
function sayBtn(text,label){return '<button class="speakbtn" data-act="say" data-text="'+esc(text)+'">'+ICON.speaker+'<span>'+esc(label)+'</span></button>';}
function tipHtml(w){return w.tipKo?'<div class="tipbox">'+two(w.tipKo,w.tipEn)+'</div>':'';}
function exHtml(w){return '<div class="exbox"><span class="de" lang="de">'+esc(w.ex)+'</span>'+two(w.exKo,w.exEn)+'</div>';}
function conjTable(v,hi){return '<table class="conj" lang="de">'+v.praes.map((f,i)=>'<tr'+(i===hi?' class="hi"':'')+'><th>'+PRON[i]+'</th><td>'+esc(f)+'</td></tr>').join('')+'</table>';}
function wordCard(w){
  const v=verbOf(w);
  let h='<div class="wordhead" lang="de">'+wordHtml(w)+'</div><div class="meanbig">'+two(w.ko,w.en)+'</div>';
  if(v)h+=conjTable(v,-1)+'<div class="row">'+sayBtn(conjText(v),'변화 듣기')+'</div>';
  h+='<div style="margin-top:8px">';
  if(w.g)h+='<span class="pill g-'+w.g+'">'+ART[w.g]+' · '+(S.lang==='en'?GEN[w.g].en:GEN[w.g].ko)+'</span>';
  if(w.pl)h+='<span class="pill" lang="de">복수: '+esc(w.pl)+'</span>';
  h+='<span class="pill">'+esc(w.topic)+' · '+esc(w.lv)+'</span></div>';
  h+=tipHtml(w)+exHtml(w);
  h+='<div class="row">'+sayBtn(w.de,'단어 듣기')+(w.pl?sayBtn(w.pl,'복수 듣기'):'')+sayBtn(w.ex,'예문 듣기')+'</div>';
  return h;
}
function wordView(id){
  const w=byId(id);
  if(!w)return '<p class="muted">단어를 찾을 수 없어요.</p>';
  const it=S.items[w.id];
  let h='<article class="card pop">'+wordCard(w);
  h+='<p class="tiny" style="margin-top:12px">'+(learned(w.id)
    ?starHtml(starsFor(w.id))+' · '+(isDue(w.id)?'오늘 복습할 단어예요':'다음 복습 '+esc(it.due))+' · 맞힌 횟수 '+(it.c||0)+'/'+it.n
    :'아직 배우지 않은 단어예요. 아래 연습을 하면 배운 단어가 돼요.')+'</p>';
  h+='</article><button class="primary" data-act="one" data-id="'+w.id+'">이 단어 연습하기</button>';
  h+='<p class="tiny">뜻 맞히기'+(w.g?' → 관사 맞히기':verbOf(w)?' → 동사 변화':'')+' → 빈칸 채우기를 한 번씩 해요.</p>';
  return h;
}

/* ---------- 기초 · 소리와 문법 메모 ---------- */
function sayRow(de,ko,en){return '<button class="sayrow" data-act="say" data-text="'+esc(de)+'">'+ICON.speaker
  +'<span><span class="de" lang="de">'+esc(de)+'</span>'+two(ko,en)+'</span></button>';}
function nextBtn(list,id,act,label){

    :'<button class="primary" data-act="back">기초 목록으로</button>';}
function soundView(id){
  const p=PHONICS.find(x=>x.id===id);

  if(!S.seen[p.id]){S.seen[p.id]=true;save();}

  h+='<p class="tiny">단어를 누르면 소리가 나요. 듣고 소리 내어 따라 해 보세요.</p>';

function noteView(id){
  const n=NOTES.find(x=>x.id===id);
  if(!n)return '<p class="muted">찾을 수 없어요.</p>';

  if(S.lang==='both')h+='<div class="muted" lang="en">'+esc(n.en)+'</div>';

/* ---------- 오늘 배우기 (새 단어 카드 → 퀴즈) ---------- */
function learnStart(){
  if(!newLeft()){toast('오늘의 새 단어 '+NEW_PER_DAY+'개를 다 배웠어요. 새 단어는 내일 또 만나요.');return;}
  const nx=nextNew(Math.min(5,newLeft()));

  clearTimers();
  G={kind:'learn',phase:'cards',words:nx.words,topic:nx.topic,li:0,d:S.diff,q:[],i:0,ok:0,xp:0,miss:[],missS:[],done:false,busy:false,cur:null,back:{name:'home'}};
  view={name:'learn'};render();window.scrollTo(0,0);autoSay(G.words[0].de);
}
function learnView(){
  const w=G.words[G.li],n=G.words.length,last=G.li===n-1;
  let h='<div class="qhead"><span class="tag">'+esc(G.topic)+' 새 단어</span><span class="tag">'+(G.li+1)+' / '+n+'</span></div>';
  h+='<article class="card pop">'+wordCard(w)+'</article>';
  h+='<button class="primary" data-af data-act="lnext">'+(last?'퀴즈 시작':'다음 단어')+'</button>';
  if(G.li)h+='<button class="ghost" data-act="lprev">이전 단어</button>';
  return h;
}
function learnQuiz(){
  /* 처음: 독일어 → 뜻 (둘은 소리만 듣고). 다음: 명사는 관사, 동사는 변화, 나머지는 뜻 → 독일어 */
  const hearN=G.words.length>=4?2:G.words.length>=2?1:0;
  const a=shuffle(G.words).map((w,i)=>i<hearN?{type:'hear',w:w}:{type:'mean',w:w,dir:'de2m'});
  const b=shuffle(G.words).map(w=>w.g?{type:'art',w:w}:verbOf(w)?{type:'conj',w:w}:{type:'mean',w:w,dir:'m2de'});
  G.phase='quiz';G.q=a.concat(b);G.i=0;view={name:'game'};nextRound(true);
}

/* ---------- 게임 공통 ---------- */
function newGame(kind,rounds,extra){
  clearTimers();
  G=Object.assign({kind:kind,d:S.diff,q:rounds,i:0,ok:0,xp:0,miss:[],missS:[],done:false,busy:false,cur:null,back:{name:'home'}},extra||{});
  view={name:'game'};nextRound(true);
}
function nextRound(first){
  if(!first)G.i++;
  G.busy=false;
  if(G.i>=G.q.length){finishGame();return;}
  G.cur=makeRound(G.q[G.i]);
  render();window.scrollTo(0,0);
  if(G.cur.type==='mean'&&G.cur.dir==='de2m')autoSay(G.cur.w.de);
  if(G.cur.type==='hear')say(G.cur.w.de);
}
function makeRound(r){
  if(r.type==='mean')return meanMake(r.w,r.dir);
  if(r.type==='hear')return Object.assign(meanMake(r.w,'de2m'),{type:'hear'});
  if(r.type==='lueck')return lueckMake(r.w);
  if(r.type==='conj')return conjMake(r.w);
  if(r.type==='type')return {type:'type',w:r.w,val:'',res:null};
  if(r.type==='order')return orderMake(r.s);
  return {type:'art',w:r.w,ans:null};
}
/* 복습 문제의 종류는 그 단어의 기억 상자로 정해요: 처음엔 고르기, 다음엔 소리 · 관사 · 변화, 나중엔 직접 쓰기 */
function canType(w){const c=w.de.replace(/…/g,'').trim();return c.split(' ').length<=4&&c.length<=24;}
function reviewRound(w){
  const b=(S.items[w.id]&&S.items[w.id].box)||0,v=verbOf(w);
  let k;
  if(b<=0)k=pick(['de2m','hear']);
  else if(b===1)k=w.g?pick(['art','m2de']):v?pick(['conj','m2de']):pick(['m2de','hear']);
  else if(b===2)k=pick(['hear','lueck'].concat(w.g?['art']:[]).concat(v?['conj']:[]));
  else k=canType(w)?pick(['type','type','lueck']):'lueck';
  if(k==='de2m')return {type:'mean',w:w,dir:'de2m'};
  if(k==='m2de')return {type:'mean',w:w,dir:'m2de'};
  return {type:k,w:w};}
function gameHead(){
  return '<div class="qhead"><span class="tag">'+esc(GAME_NAME[G.kind])+'</span><span class="tag">'+(G.i+1)+' / '+G.q.length+'</span>'
    +'<span class="spacer"></span><span class="tag">'+esc(DIFF[G.d].name)+' ×'+DIFF[G.d].mult+'</span></div>'
    +'<div class="prog" aria-hidden="true"><i style="width:'+Math.round(G.i/G.q.length*100)+'%"></i></div>';
}
function gameView(){
  const c=G.cur;if(!c)return '';
  let h=gameHead()+'<article class="gcard pop">';
  h+=c.type==='mean'||c.type==='hear'?meanView(c):c.type==='art'?artView(c):c.type==='conj'?conjView(c)
    :c.type==='type'?typeView(c):c.type==='order'?orderView(c):lueckView(c);
  return h+'</article>';
}
function settle(w,ok,pts){
  G.busy=true;
  if(ok){G.ok++;G.xp+=Math.round(pts*DIFF[G.d].mult);}
  else if(G.miss.indexOf(w.id)<0)G.miss.push(w.id);
  const dr=dayRec();dr.n++;if(ok)dr.c++;
  grade(w,ok);
  sfx(ok?'ok':'bad');
}
function nextHtml(){return '<button class="primary" data-af data-act="gnext">'+(G.i+1>=G.q.length?'결과 보기':'다음')+'</button>';}
function afterHtml(w,noTip){
  /* 답을 고른 뒤: 다음 버튼을 먼저 (스크롤 없이 누를 수 있게), 그 아래 예문, 도움말, 듣기 */
  return nextHtml()+exHtml(w)+(noTip?'':tipHtml(w))+'<div class="row">'+sayBtn(w.de,'단어 듣기')+sayBtn(w.ex,'예문 듣기')+'</div>';
}
/* 단어 없이 채점하는 문제 (순서 맞추기) */
function settleNo(ok,pts,s){
  G.busy=true;
  if(ok){G.ok++;G.xp+=Math.round(pts*DIFF[G.d].mult);}else if(s&&G.missS.indexOf(s)<0)G.missS.push(s);
  const dr=dayRec();dr.n++;if(ok)dr.c++;save();
  sfx(ok?'ok':'bad');}
function finishGame(){
  const before=lvl(S.xp);
  G.done=true;G.cur=null;
  /* 다섯 문제 이상인 게임만 오늘의 목표에 들어가요. 첫 게임 보너스는 절반 이상 맞혔을 때. */
  const counts=G.q.length>=5;
  if(G.kind==='learn'){G.xp+=10;S.today.nw=(S.today.nw||0)+G.words.length;}
  if(counts&&S.today.games===0&&G.ok*2>=G.q.length){G.xp+=20;G.firstBonus=true;}
  if(counts)S.today.games++;
  S.xp+=Math.max(0,Math.round(G.xp));
  S.log.push({d:todayStr(),g:G.kind,ok:G.ok,t:G.q.length,x:G.xp,df:G.d});
  if(S.log.length>240)S.log=S.log.slice(-240);
  const dr=dayRec();dr.x+=Math.max(0,Math.round(G.xp));dr.g++;
  const dk=Object.keys(S.days).sort();if(dk.length>120)dk.slice(0,dk.length-120).forEach(k=>{delete S.days[k];});
  touchStreak();save();syncNow();
  G.levelUp=lvl(S.xp)>before?lvl(S.xp):0;
  sfx('win');render();
  announce('끝났어요. '+G.q.length+'문제 중 '+G.ok+'개 정답, '+G.xp+' XP');
}
function resultSheet(){
  const rate=G.q.length?G.ok/G.q.length:0;
  let h='<div class="sheetwrap"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="결과">';
  h+='<h3>'+(G.kind==='learn'&&rate>=0.6?'새 단어 '+G.words.length+'개를 배웠어요!':rate>=0.9?'아주 잘했어요!':rate>=0.6?'잘했어요!':'한 번 더 해 봐요')+'</h3>';
  h+='<div class="xpline">정답 <b>'+G.ok+' / '+G.q.length+'</b> · <b>+'+G.xp+' XP</b></div>';
  if(G.firstBonus)h+='<div class="tiny">오늘 첫 게임 보너스 +20 XP 포함</div>';
  if(G.levelUp)h+='<div class="fb ok">레벨 업! Lv '+G.levelUp+' · '+esc(lvlTitle(G.levelUp))+'</div>';
  if(G.kind==='learn')h+='<p class="tiny">'+(G.miss.length?'틀린 단어는 오늘, 나머지는 내일 <b>오늘 복습</b>에 다시 나와요.':'이 단어들은 내일 <b>오늘 복습</b>에 다시 나와요.')+'</p>';
  if(G.miss.length)h+='<div class="fb bad">다시 볼 단어<br>'+G.miss.map(id=>{const w=byId(id);return '<span lang="de">'+wordHtml(w)+'</span> — '+esc(mean(w));}).join('<br>')+'</div>';
  if(G.missS.length)h+='<div class="fb bad">다시 볼 문장<br>'+G.missS.map(s=>'<span lang="de">'+esc(s.de)+'</span> — '+esc(S.lang==='en'?s.en:s.ko)).join('<br>')+'</div>';
  const more=G.kind==='learn'?(newLeft()&&nextNew(1)?'다음 단어 배우기':''):G.kind==='review'?(dueWords().length?'복습 더 하기 ('+dueWords().length+'개)':''):'다시 하기';
  h+='<div class="btnrow">'+(more?'<button class="ghost" data-act="retry">'+more+'</button>':'')
    +'<button class="primary" data-af data-act="gdone">'+(G.kind==='one'?'단어로 돌아가기':'홈으로')+'</button></div></div></div>';
  return h;
}

/* ---------- 게임 0 · 뜻 맞히기 ---------- */
function meanMake(w,dir){
  dir=dir||(G.d===1?'de2m':G.d===2?pick(['de2m','m2de']):'m2de');
  const cls=x=>x.g?'n':x.pos;
  /* 뜻이 겹치는 단어(집 · 아파트, number · number)는 보기로 같이 내지 않아요 */
  const gl=x=>(x.ko+'/'+x.en).split(/[\/,()·;]/).map(s=>s.trim().toLowerCase()).filter(Boolean),mine=new Set(gl(w));
  const cand=WORDS.filter(o=>o.id!==w.id&&!gl(o).some(g=>mine.has(g)))
    .map(o=>({o:o,s:(o.topic===w.topic?2:0)+(cls(o)===cls(w)?1.5:0)+(learned(o.id)?1:0)+Math.random()*2}))
    .sort((a,b)=>b.s-a.s).slice(0,DIFF[G.d].opts-1).map(x=>x.o);
  return {type:'mean',w:w,dir:dir,opts:shuffle([w].concat(cand)),ans:null};
}
function meanView(c){
  const w=c.w,de=c.dir==='de2m',hear=c.type==='hear';
  let h='<div class="muted">'+(hear?'잘 듣고 뜻을 고르세요':de?'이 단어의 뜻은?':'독일어로는?')+'</div>';
  if(hear)h+='<button class="bigsay" data-act="say" data-text="'+esc(w.de)+'">'+ICON.speaker+'<span>다시 듣기</span></button>'
    +(G.busy?'<div class="qword" lang="de">'+wordHtml(w)+'</div>':'');
  else h+=de?'<div class="qword" lang="de">'+wordHtml(w)+'</div><div class="row">'+sayBtn(w.de,'듣기')+'</div>'
       :'<div class="qmean">'+two(w.ko,w.en)+'</div>';
  h+='<div class="opts" role="group" aria-label="보기">';
  c.opts.forEach((o,i)=>{
    let cls='opt';
    if(G.busy){if(o.id===w.id)cls+=' good';else if(c.ans===i)cls+=' wrong';}
    h+='<button class="'+cls+'" data-act="opt" data-i="'+i+'"'+(G.busy?' disabled':'')+(de?'':' lang="de"')+'>'
      +(de?esc(mean(o)):wordHtml(o))+'</button>';
  });
  h+='</div>';
  if(G.busy){
    const ok=c.opts[c.ans].id===w.id;
    h+='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'정답! ':'아쉬워요. ')+'<span lang="de">'+wordHtml(w)+'</span> = '+esc(mean(w))+'</div>'+afterHtml(w);
    const v=verbOf(w);if(v)h+=conjTable(v,-1);
  }
  return h;
}
function meanAnswer(i){
  const c=G.cur;if(!c.opts[i])return;
  c.ans=i;const ok=c.opts[i].id===c.w.id;
  settle(c.w,ok,10);
  announce((ok?'정답. ':'오답. ')+c.w.de+' = '+mean(c.w));
  render();
  if(c.dir==='m2de')autoSay(c.w.de);
}
/* ---------- 동사 변화 ---------- */
function conjMake(w){
  const v=verbOf(w),p=Math.floor(Math.random()*6),ans=v.praes[p];
  const others=Array.from(new Set(v.praes.concat([v.inf]))).filter(f=>f!==ans);
  return {type:'conj',w:w,v:v,p:p,ans:ans,opts:shuffle([ans].concat(shuffle(others).slice(0,DIFF[G.d].opts-1))),pick:null};}
function conjView(c){
  const v=c.v;
  let h='<div class="muted">알맞은 동사 꼴을 고르세요</div>';

/* ---------- 직접 쓰기 ---------- */
const UML=['ä','ö','ü','ß'];
function normDe(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/…/g,' ').replace(/[.,!?;:—]/g,' ')
  .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,' ').trim();}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;
  let p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}
  return p[b.length];}
function typeTarget(w){return w.de.replace(/\s*…\s*/g,' ').trim();}
/* 채점: 대소문자와 끝의 문장 부호는 보지 않아요. ae/oe/ue/ss는 ä/ö/ü/ß로 쳐요. 다섯 글자 이상이면 한 글자 실수는 맞음(알려 줘요).
   명사는 관사까지 맞아야 해요. */
function typeGrade(w,val){
  const want=normDe(typeTarget(w)),got=normDe(val);
  if(!got)return {ok:false,why:'empty'};
  if(got===want)return {ok:true,why:''};
  if(w.g){const core=normDe(coreOf(w)),gp=got.split(' ');
    if(got===core)return {ok:false,why:'noart'};
    if(gp.length>=2&&['der','die','das'].includes(gp[0])&&gp.slice(1).join(' ')===core)return {ok:false,why:'art'};}
  if(want.length>=5&&lev(got,want)===1)return {ok:true,why:'typo'};
  return {ok:false,why:'wrong'};}
function typeHint(w){return typeTarget(w).split(' ').map(x=>x[0]+'_'.repeat(Math.max(0,x.length-1))).join(' ');}
function typeView(c){
  const w=c.w;
  let h='<div class="muted">독일어로 써 보세요'+(w.g?' · <b>der / die / das</b>와 함께':'')+'</div>';
  h+='<div class="qmean">'+two(w.ko,w.en)+'</div>';
  if(!G.busy){
    if(G.d===1)h+='<div class="tiny">힌트: <span class="hint" lang="de">'+esc(typeHint(w))+'</span></div>';
    h+='<input id="typeIn" class="typein" lang="de" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="독일어로 쓰기" data-af>';
    h+='<div class="umlauts" role="group" aria-label="특수 문자">'+UML.map(ch=>'<button data-act="tins" data-ch="'+ch+'" lang="de">'+ch+'</button>').join('')+'</div>';
    h+='<div class="btnrow"><button class="ghost" data-act="tskip">모르겠어요</button><button class="primary" data-act="tcheck">확인</button></div>';
  }else{
    const r=c.res,msg={'':'정답! ',typo:'거의 맞았어요. 철자를 확인해요: ',noart:'관사까지 써요: ',art:'관사가 달라요: ',wrong:'아쉬워요. 바른 답: ',empty:'바른 답: '}[r.why];
    if(c.val)h+='<div class="tiny">쓴 답: <span lang="de">'+esc(c.val)+'</span></div>';
    h+='<div class="fb '+(r.ok?'ok':'bad')+'">'+msg+'<span lang="de">'+wordHtml(w)+'</span></div>'+afterHtml(w);}
  return h;}
function typeCheck(skip){

  c.val=val;c.res=skip?{ok:false,why:'empty'}:typeGrade(c.w,val);
  if(!skip&&c.res.why==='empty'){toast('답을 써 주세요. 모르면 "모르겠어요"를 눌러요.');return;}

  try{const a=el.selectionStart==null?el.value.length:el.selectionStart,b=el.selectionEnd==null?a:el.selectionEnd;

/* ---------- 순서 맞추기 ---------- */
let capSet=null;
/* 문장 첫 단어는 소문자로 보여 줘요 (대문자가 정답을 알려 주지 않게). 명사와 이름처럼 원래 대문자인 말만 그대로. */
function capKeep(){if(capSet)return capSet;const s=new Set();
  const add=x=>sentParts(x).forEach((p,i)=>{if(i>0&&p.w&&p.w[0]!==p.w[0].toLowerCase())s.add(p.w);});
  WORDS.forEach(w=>add(w.ex));SENTENCES.forEach(x=>add(x.de));NOTES.forEach(n=>n.ex.forEach(x=>add(x.de)));
  return capSet=s;}
function orderKey(x){return sentParts(x).map(p=>p.w).filter(Boolean).join(' ').toLowerCase();}
function orderMake(s){
  const parts=sentParts(s.de).filter(p=>p.w),toks=parts.map((p,i)=>i===0&&!capKeep().has(p.w)?p.w.toLowerCase():p.w);
  let ord=toks.map((_,i)=>i);
  for(let k=0;k<6&&ord.every((x,i)=>x===i);k++)ord=shuffle(ord);
  return {type:'order',s:s,toks:toks,ord:ord,pick:[],end:parts[parts.length-1].trail||'.',ok:null,alt:false};}
function orderView(c){

  h+=(full?'<span class="end">'+esc(c.end)+'</span>':'')+'</div>';

    c.ord.forEach(ti=>{if(c.pick.indexOf(ti)<0)h+='<button class="chipbtn" lang="de" data-act="opick" data-i="'+ti+'">'+esc(c.toks[ti])+'</button>';});

      +nextHtml()+'<div class="row">'+sayBtn(c.s.de,'문장 듣기')+'</div>';
    if(!c.ok&&c.s.alt&&c.s.alt.length)h+='<p class="tiny">이렇게도 맞아요: <span lang="de">'+c.s.alt.map(esc).join(' · ')+'</span></p>';
    h+='<p class="tiny">동사(움직임을 나타내는 말)는 평서문에서 둘째 자리, 네/아니요 질문에서는 맨 앞에 와요.</p>';}
  return h;}
function orderPick(ti){const c=G.cur;if(!(ti>=0&&ti<c.toks.length)||c.pick.indexOf(ti)>=0)return;c.pick.push(ti);render();}
function orderUnpick(k){const c=G.cur;if(k>=0&&k<c.pick.length){c.pick.splice(k,1);render();}}
function orderCheck(){

  settleNo(c.ok,15,c.s);

/* ---------- 게임 4 · 관사 맞히기 ---------- */
function genderRule(w){
  const c=coreOf(w).toLowerCase();
  if(w.g==='f'&&/(ung|heit|keit|schaft|tion|tät)$/.test(c))return {ko:'-ung, -heit, -keit, -schaft, -tion으로 끝나는 명사는 항상 die예요.',en:'Nouns ending in -ung, -heit, -keit, -schaft, -tion are always die.'};
  if(w.g==='n'&&/(chen|lein)$/.test(c))return {ko:'-chen, -lein으로 끝나는 명사는 항상 das예요.',en:'Nouns ending in -chen or -lein are always das.'};
  if(w.g==='m'&&/^(montag|monat|tag|morgen|abend)$/.test(c))return {ko:'요일, 달, 하루의 때(아침 · 저녁)는 대부분 der예요. 밤(die Nacht)만 달라요.',en:'Days, months and times of day are mostly der. Only die Nacht is different.'};
  if(w.g==='f'&&/e$/.test(c))return {ko:'-e로 끝나는 명사는 대부분 die예요.',en:'Most nouns ending in -e are die.'};
  return null;
}

/* ---------- 게임 1 · 빈칸 채우기 ---------- */
const LEAD_DASH='—…';        /* 문장 앞 줄표: 단어와 떨어뜨리되 화면에는 남긴다 */
const TRAIL_PUNCT=',.!?;:';  /* 문장 부호는 단어에 붙이지 않고 따로 보관 */
function sentParts(s){
  const parts=[];
  String(s).split(' ').forEach(tok=>{
    if(!tok)return;
    let lead='',trail='';
    while(tok.length&&LEAD_DASH.indexOf(tok[0])>=0){lead+=tok[0];tok=tok.slice(1);}
    while(tok.length&&TRAIL_PUNCT.indexOf(tok[tok.length-1])>=0){trail=tok[tok.length-1]+trail;tok=tok.slice(0,-1);}
    parts.push({w:tok,lead:lead,trail:trail});
  });
  return parts;}
/* 예문 안에서 그 단어(또는 그 단어의 변한 꼴)가 있는 자리 */
function targetIdx(w,parts){
  const v=verbOf(w);
  const cs=v?[v.inf].concat(v.praes).map(x=>x.toLowerCase()):coreOf(w).toLowerCase().replace(/[?!.,…]/g,' ').split(' ').filter(Boolean);
  const out=[];
  parts.forEach((p,i)=>{const t=p.w.toLowerCase();if(!t)return;
    if(cs.some(c=>t===c||(!v&&c.length>3&&t.indexOf(c.slice(0,c.length-1))===0)))out.push(i);});
  return out;}
/* 헷갈리는 칩의 첫 글자를 빈칸 자리에 맞춰요 (문장 첫머리면 대문자, 가운데면 소문자) */
function sameCase(model,s,keep){const up=model[0]!==model[0].toLowerCase();
  return up?s[0].toUpperCase()+s.slice(1):keep?s:s[0].toLowerCase()+s.slice(1);}
function lueckMake(w){
  const parts=sentParts(w.ex),words=parts.map((p,i)=>i).filter(i=>parts[i].w);
  const tg=targetIdx(w,parts).sort((a,b)=>parts[b].w.length-parts[a].w.length);
  const main=tg.length?tg[0]:words[words.length-1];
  const want=Math.max(1,Math.min(DIFF[G.d].blanks,words.length-1));
  const rest=tg.slice(1).concat(shuffle(words.filter(i=>i!==main&&tg.indexOf(i)<0&&i>0&&parts[i].w.length>2)));
  const idxs=[main].concat(rest.slice(0,want-1)).sort((a,b)=>a-b);
  const answers=idxs.map(i=>parts[i].w);
  /* 헷갈리는 칩: 빈칸의 단어와 같은 종류의 다른 단어 */
  const cls=x=>x.g?'n':x.pos,decoys=[];
  const has=t=>answers.concat(decoys).some(a=>a.toLowerCase()===t.toLowerCase());
  /* 동사의 빈칸이면 같은 동사의 다른 꼴이 헷갈리는 칩이 돼요 (lerne · lernst · lernt) */
  const vb=verbOf(w);
  if(vb)for(const f of shuffle(Array.from(new Set(vb.praes.concat([vb.inf]))))){
    if(decoys.length>=DIFF[G.d].decoys)break;const d=sameCase(parts[main].w,f);if(!has(d))decoys.push(d);}
  for(const o of shuffle(WORDS)){
    if(decoys.length>=DIFF[G.d].decoys)break;
    if(o.id===w.id||cls(o)!==cls(w))continue;
    const t=coreOf(o);
    if(t.indexOf(' ')>=0||t.length<2)continue;
    const d=w.g?t:sameCase(parts[main].w,t,o.pos==='name'||o.pos==='n'||t==='Sie');
    if(!has(d))decoys.push(d);
  }
  for(const o of shuffle(WORDS)){
    if(decoys.length>=DIFF[G.d].decoys)break;
    for(const p of sentParts(o.ex)){
      if(decoys.length>=DIFF[G.d].decoys)break;
      if(p.w.length>2&&!has(p.w))decoys.push(p.w);
    }
  }
  return {type:'lueck',w:w,parts:parts,idxs:idxs,answers:answers,chips:shuffle(answers.concat(decoys)),fill:idxs.map(()=>-1),ok:null};
}
function lueckView(c){
  const w=c.w,full=c.fill.every(x=>x>=0);
  let h='<div class="muted">알맞은 단어를 눌러 빈칸을 채우세요. 채운 칸을 누르면 다시 빠져요.</div>';
  h+='<div class="qsent" lang="de">';
  c.parts.forEach((p,i)=>{
    const k=c.idxs.indexOf(i);
    if(k<0){h+=esc(p.lead+p.w+p.trail)+' ';return;}
    const ci=c.fill[k],txt=ci>=0?c.chips[ci]:'';
    let cls='blank';
    if(G.busy)cls+=(txt===c.answers[k]?' good':' wrong');else if(ci>=0)cls+=' filled';
    h+=esc(p.lead)+'<button class="'+cls+'" data-act="unfill" data-k="'+k+'"'+(G.busy||ci<0?' disabled':'')
      +' aria-label="빈칸 '+(k+1)+(txt?': '+esc(txt):'')+'">'+(txt?esc(txt):'&nbsp;')+'</button>'+esc(p.trail)+' ';
  });
  h+='</div><div class="meanbig">'+two(w.exKo,w.exEn)+'</div>';
  if(!G.busy){
    h+='<div class="chips" role="group" aria-label="단어 칩">';
    c.chips.forEach((t,ci)=>{h+='<button class="chipbtn" lang="de" data-act="chip" data-ci="'+ci+'"'+(c.fill.indexOf(ci)>=0?' disabled':'')+'>'+esc(t)+'</button>';});
    h+='</div><button class="primary" data-act="check"'+(full?' data-af':' disabled')+'>확인</button>';
  }else{
    h+='<div class="fb '+(c.ok?'ok':'bad')+'">'+(c.ok?'정답! ':'아쉬워요. 바른 문장: ')+'<span lang="de">'+esc(w.ex)+'</span></div>'
      +nextHtml()+tipHtml(w)+'<div class="row">'+sayBtn(w.ex,'문장 듣기')+'</div>';
  }
  return h;
}
function lueckChip(ci){
  const c=G.cur;if(!(ci>=0&&ci<c.chips.length)||c.fill.indexOf(ci)>=0)return;
  const k=c.fill.indexOf(-1);if(k<0)return;
  c.fill[k]=ci;render();
}
function lueckUnfill(k){const c=G.cur;if(c.fill[k]>=0){c.fill[k]=-1;render();}}
function lueckCheck(){
  const c=G.cur;if(!c.fill.every(x=>x>=0))return;
  c.ok=c.fill.every((ci,k)=>c.chips[ci]===c.answers[k]);
  settle(c.w,c.ok,15);
  announce(c.ok?'정답':'오답. '+c.w.ex);

}

/* ---------- 게임 시작 ---------- */
function needLearned(pool,min,what){

  return false;}
function startMean(){const pool=learnedIn(scopeWords());

function startLueck(){const pool=learnedIn(scopeWords());
  if(needLearned(pool,3,'단어를'))newGame('lueck',shuffle(pool).slice(0,6).map(w=>({type:'lueck',w:w})));}
function startHear(){const pool=learnedIn(scopeWords());
  if(needLearned(pool,4,'단어를'))newGame('hear',shuffle(pool).slice(0,8).map(w=>({type:'hear',w:w})));}
/* 동사 변화는 주제와 상관없이 배운 동사 전부에서 (동사가 적으면 같은 동사를 다른 사람으로 또 물어요) */
function startConj(){const pool=learnedIn(WORDS).filter(w=>verbOf(w));
  if(pool.length<2){toast('먼저 "오늘 배우기"로 동사를 2개 이상 배워요. (지금 '+pool.length+'개)');return;}
  const q=[];while(q.length<8)shuffle(pool).forEach(w=>{if(q.length<8)q.push({type:'conj',w:w});});
  newGame('conj',q);}
function startType(){const pool=learnedIn(scopeWords()).filter(canType);
  if(needLearned(pool,3,'단어를'))newGame('type',shuffle(pool).slice(0,6).map(w=>({type:'type',w:w})));}
/* 순서 맞추기: 배운 단어가 적으면 앞쪽의 쉬운 문장에서 */
function startOrder(){const n=learnedIn(WORDS).length;
  if(n<5){toast('먼저 "오늘 배우기"를 한 번 해요. 그다음 문장을 만들어 봐요.');return;}
  const pool=n<40?SENTENCES.slice(0,16):SENTENCES;
  newGame('order',shuffle(pool).slice(0,6).map(s=>({type:'order',s:s})));}
function startReview(){
  /* 오래 밀린 단어부터, 한 번에 10개. 명사는 뜻과 관사를 번갈아 물어요 */
  const due=shuffle(dueWords()).sort((a,b)=>S.items[a.id].due<S.items[b.id].due?-1:S.items[a.id].due>S.items[b.id].due?1:0).slice(0,10);
  if(!due.length){toast('오늘 복습할 단어가 없어요.');return;}
  newGame('review',shuffle(due).map(reviewRound));
}
function startOne(id){
  const w=byId(id);if(!w)return;
  newGame('one',[{type:'mean',w:w}].concat(w.g?[{type:'art',w:w}]:verbOf(w)?[{type:'conj',w:w}]:[]).concat([{type:'lueck',w:w}]),{back:{name:'word',id:w.id}});
}
function retry(){
  const k=G.kind,back=G.back;
  if(k==='learn')learnStart();
  else if(k==='mean')startMean();
  else if(k==='art')startArt();
  else if(k==='lueck')startLueck();
  else if(k==='hear')startHear();
  else if(k==='conj')startConj();
  else if(k==='type')startType();
  else if(k==='order')startOrder();
  else if(k==='review'){if(dueWords().length)startReview();else go({name:'home'});}
  else if(k==='one')startOne(back.id);
  if(G&&G.done)go({name:'home'});   /* 다시 시작하지 못했으면 홈으로 */
}

/* ---------- 이벤트 ---------- */
$('#app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  unlockAudio();
  const d=el.dataset,inGame=G&&!G.done&&view.name==='game';
  switch(d.act){
    case 'sound': S.sound=!S.sound;save();if(!S.sound)stopSay();render();announce('효과음과 자동 읽기 '+(S.sound?'켜짐':'꺼짐'));break;
    case 'topic': if(TOPICS.includes(d.topic)){S.topic=d.topic;save();render();}break;
    case 'diff':{const n=Number(d.diff);if(DIFF[n]){S.diff=n;save();render();announce('난이도 '+DIFF[n].name);}break;}
    case 'lang': if(['both','ko','en'].includes(d.lang)){S.lang=d.lang;save();render();}break;
    case 'openw': go({name:'word',id:Number(d.id),ret:view.name==='rec'?'rec':null});break;
    case 'opens': go({name:'sound',id:d.id});break;
    case 'openn': go({name:'note',id:d.id});break;
    case 'say': say(d.text||'');break;
    case 'back': doBack();break;
    case 'learn': learnStart();break;
    case 'lnext': if(G&&G.kind==='learn'&&G.phase==='cards'){
        if(G.li<G.words.length-1){G.li++;render();window.scrollTo(0,0);autoSay(G.words[G.li].de);}else learnQuiz();}break;
    case 'lprev': if(G&&G.kind==='learn'&&G.phase==='cards'&&G.li>0){G.li--;render();window.scrollTo(0,0);}break;
    case 'review': startReview();break;
    case 'listen': plStart();break;
    case 'plstop': plStop();clearTimers();stopSay();render();break;
    case 'plgo': if(PL.list.length&&!PL.on){PL.on=true;PL.step=0;render();plPlay();}break;
    case 'plprev': plJump(-1);break;
    case 'plnext': plJump(1);break;
    case 'gmean': startMean();break;
    case 'gart': startArt();break;
    case 'glueck': startLueck();break;
    case 'ghear': startHear();break;
    case 'gconj': startConj();break;
    case 'gtype': startType();break;
    case 'gorder': startOrder();break;
    case 'cpick': if(inGame&&!G.busy&&G.cur.type==='conj')conjAnswer(Number(d.i));break;
    case 'tins': if(inGame&&!G.busy&&G.cur.type==='type'&&UML.includes(d.ch))typeInsert(d.ch);break;
    case 'tcheck': if(inGame&&!G.busy&&G.cur.type==='type')typeCheck(false);break;
    case 'tskip': if(inGame&&!G.busy&&G.cur.type==='type')typeCheck(true);break;
    case 'opick': if(inGame&&!G.busy&&G.cur.type==='order')orderPick(Number(d.i));break;
    case 'ounpick': if(inGame&&!G.busy&&G.cur.type==='order')orderUnpick(Number(d.k));break;
    case 'ocheck': if(inGame&&!G.busy&&G.cur.type==='order')orderCheck();break;
    case 'backupSave': backupSave();break;
    case 'backupLoad': {const f=$('#bkFile');if(f&&f.click)f.click();break;}
    case 'one': startOne(Number(d.id));break;
    case 'opt': if(inGame&&!G.busy&&(G.cur.type==='mean'||G.cur.type==='hear'))meanAnswer(Number(d.i));break;
    case 'art': if(inGame&&!G.busy&&G.cur.type==='art')artAnswer(d.g);break;
    case 'chip': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckChip(Number(d.ci));break;
    case 'unfill': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckUnfill(Number(d.k));break;
    case 'check': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckCheck();break;
    case 'gnext': if(inGame&&G.busy){stopSay();nextRound(false);}break;
    case 'retry': if(G&&G.done)retry();break;
    case 'gdone': go(G&&G.kind==='one'&&G.back?G.back:{name:'home'});break;
    case 'tourOpen': ui.tour=0;render();break;
    case 'tourNext': ui.tour=Math.min(TOUR.length-1,(ui.tour||0)+1);render();break;
    case 'tourPrev': ui.tour=Math.max(0,(ui.tour||0)-1);render();break;
    case 'tourClose': ui.tour=null;try{localStorage.setItem(TOUR_KEY,'1');}catch(e){}render();break;
    case 'reset': ui.confirmReset=true;render();break;
    case 'resetNo': ui.confirmReset=false;render();break;
    case 'resetYes': S=Object.assign(blank(),{acct:S.acct,lang:S.lang,voice:S.voice,sound:S.sound,rz:Date.now()});save();go({name:'home'});
      toast('진도를 지웠어요.');syncNow();break;
    case 'voice': if(d.voice==='f'||d.voice==='m'){S.voice=d.voice;save();render();say('Guten Tag');}break;
    case 'tab': go({name:d.tab==='rec'?'rec':'home'});if(d.tab==='rec')refreshRec();break;
    case 'who': if(d.id===WHO.cur){ui.sheet={kind:'who',id:d.id};render();}else switchPerson(d.id);break;
    case 'whoAdd': if(WHO.list.length<6){ui.sheet={kind:'who',id:null};render();}break;
    case 'whoSave': whoSave();break;
    case 'whoDel': whoDel();break;
    case 'sheetClose': ui.sheet=null;render();break;
    case 'acctOpen': ui.sheet={kind:'acct',mode:d.mode==='login'?'login':'signup'};render();break;
    case 'acctGo': acctSubmit();break;
    case 'acctOut': S.acct=null;sync.board=null;sync.err='';sync.at=0;try{localStorage.removeItem(BOARD_KEY);}catch(x){}save();render();
      toast('이 기기에서 계정 연결을 끊었어요. 진도는 이 기기에 그대로 있어요.');break;
    case 'syncGo': syncNow().then(ok=>{toast(ok?'계정에 저장했어요.':'저장하지 못했어요. '+sync.err);loadBoard();});break;
    default: break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target&&e.target.id==='typeIn'&&G&&G.cur&&G.cur.type==='type'&&!G.busy){e.preventDefault();typeCheck(false);return;}
  if(!ui.sheet)return;
  const b=$('#app [data-enter]');if(b&&e.target&&e.target.tagName==='INPUT'){e.preventDefault();b.click();}
});
/* ä ö ü ß 버튼을 눌러도 입력칸의 키보드가 닫히지 않게 */
document.addEventListener('mousedown',e=>{const b=e.target&&e.target.closest&&e.target.closest('[data-act="tins"]');if(b)e.preventDefault();});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bkFile'&&e.target.files)backupRead(e.target.files[0]);});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(sync.dirty)syncNow();}
  else if(canSync()&&Date.now()-sync.at>60000)syncNow().then(()=>{if(view.name==='rec')loadBoard();});
});
if(canSync())syncNow();
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(ui.tour!==null){ui.tour=null;try{localStorage.setItem(TOUR_KEY,'1');}catch(x){}render();}
  else if(ui.sheet){ui.sheet=null;render();}
  else if(view.name!=='home'&&view.name!=='rec')doBack();
});

/* ---------- 시작 ---------- */
if(!tourSeen())ui.tour=0;
render();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
