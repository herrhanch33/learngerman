<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="description" content="독일어 놀이터 · 독일어를 처음부터, 하루 5분. German for beginners, with Korean and English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독일어">
<title>독일어 놀이터 · Deutsch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ---------- 디자인 토큰 ---------- */
:root{
  --bg:#f4efe6; --surface:#ffffff; --surface2:#eee7d8; --ink:#23252b; --ink2:#5c6270;
  --line:#ddd5c4; --accent:#2f6fed; --accent-ink:#ffffff;
  --gold:#96700f; --ok:#1e7a45; --warn:#b3362c;
  --masc:#2456b0; --fem:#b02f45; --neu:#226b35;
  --hero:#e8efff; --hero-ink:#1c2a4a;
  --r:17px;
  --font-d:'Jua',sans-serif; --font-b:'Gowun Dodum',sans-serif;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161c; --surface:#1e222b; --surface2:#262b36; --ink:#e9ecf2; --ink2:#a3acba;
    --line:#333a47; --accent:#6ea0ff; --accent-ink:#0f1218;
    --gold:#e0b45c; --ok:#5fc98a; --warn:#f0837a;
    --masc:#8fb4ff; --fem:#ff93a6; --neu:#84d69a;
    --hero:#22304a; --hero-ink:#e9ecf2;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;
  min-height:44px;min-width:44px;padding:8px 14px}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
button[disabled]{opacity:.45;cursor:default}
p{margin:8px 0}

/* ---------- 레이아웃 ---------- */
#app{max-width:560px;margin:0 auto;
  padding:var(--safe-t) max(16px,var(--safe-r)) calc(28px + var(--safe-b)) max(16px,var(--safe-l));word-break:keep-all}
main{display:block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink2);font-size:14px}
.tiny{color:var(--ink2);font-size:13px;margin:6px 0}
.de{font-size:19px}
.ko{font-size:14px;color:var(--ink2)}
.en{font-size:14px;color:var(--ink2)}
.tr{display:block;font-size:14px;color:var(--ink2)}
.meanbig .tr{font-size:17px;color:var(--ink)}
.meanbig .tr+.tr{color:var(--ink2)}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .22s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:scale(1);opacity:1}}
}

/* ---------- 헤더 ---------- */
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.top h1{font-family:var(--font-d);font-size:20px;margin:0;font-weight:400}
.vtitle{font-family:var(--font-d);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;white-space:nowrap}
.iconbtn{border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;padding:8px;flex:none}
.iconbtn svg{width:20px;height:20px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);font-size:15px;padding:8px 12px;flex:none}
.backbtn svg{width:18px;height:18px}

/* ---------- 홈 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:16px;margin:8px 0 12px}
.hero h2{font-family:var(--font-d);font-size:22px;margin:0 0 2px;font-weight:400}
.hero .muted{color:inherit;opacity:.8}
.bar{height:10px;border-radius:999px;background:rgba(127,127,127,.28);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(127,127,127,.14);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-weight:400;font-size:20px}
.stat b em{font-style:normal;font-size:14px;opacity:.75}
.stat span{font-size:12.5px;opacity:.85}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);
  border-radius:var(--r);padding:14px 16px;margin:10px 0}
.cta .cta-main{display:block;font-family:var(--font-d);font-size:19px}
.cta .cta-sub{display:block;font-size:13.5px;opacity:.92}
.cta svg{width:22px;height:22px;flex:none}
.cta.second{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.cta.second .cta-sub{color:var(--ink2);opacity:1}
.secttl{font-family:var(--font-d);font-size:18px;font-weight:400;margin:18px 0 6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.modebtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;display:flex;flex-direction:column;
  gap:2px;justify-content:center;min-height:70px;padding:10px 12px}
.modebtn b{font-family:var(--font-d);font-weight:400;font-size:16px}
.modebtn span{font-size:12.5px;color:var(--ink2)}
@media (max-width:359px){.modes{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;white-space:nowrap;padding:8px 14px;font-size:15px;flex:none}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .cnt{font-size:12px;opacity:.75;margin-left:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;min-height:60px}
.wrow .main{flex:1;min-width:0}
.wrow .w{font-size:18px;display:block;overflow-wrap:anywhere}
.wrow .m{font-size:13.5px;color:var(--ink2);display:block}
.wrow .side{flex:none;text-align:right}
.art{font-weight:700}
.g-m{color:var(--masc)} .g-f{color:var(--fem)} .g-n{color:var(--neu)}
.newtag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12px;color:var(--ink2)}
.duetag{display:inline-block;border:1px solid var(--gold);border-radius:8px;padding:1px 7px;font-size:12px;color:var(--gold)}
.stars{font-size:14px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.stars .off{color:var(--line)}
.pletter{font-family:var(--font-d);font-size:22px;min-width:64px;text-align:center;color:var(--accent);flex:none}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.link{color:var(--accent);text-decoration:underline;padding:8px 4px;min-width:0}
.danger{color:var(--warn)}

/* ---------- 단어 보기 · 기초 ---------- */
.wordhead{font-family:var(--font-d);font-size:30px;font-weight:400;margin:2px 0;overflow-wrap:anywhere}
.meanbig{font-size:18px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);margin:2px 4px 2px 0}
.exbox{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:10px 0}
.exbox .de{display:block}
.tipbox{border-left:4px solid var(--gold);padding:6px 10px;margin:10px 0;font-size:14.5px}
.tipbox .en{display:block}
.speakbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);padding:8px 14px;font-size:15px}
.speakbtn svg{width:19px;height:19px;flex:none}
.sayrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface2);border-radius:12px;padding:8px 12px;margin:6px 0}
.sayrow svg{width:20px;height:20px;flex:none;color:var(--accent)}
.sayrow .de{display:block}
.note p{margin:10px 0}
.note .en{display:block;margin-top:2px}

/* ---------- 게임 ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.qhead .tag{font-family:var(--font-d);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface)}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;background:var(--accent)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:8px 0}
.qword{font-family:var(--font-d);font-size:32px;font-weight:400;margin:6px 0 2px;overflow-wrap:anywhere}
.qmean{font-size:22px;margin:8px 0 2px}
.qsent{font-size:21px;line-height:1.9;margin:8px 0}
.blank{display:inline-block;min-width:70px;min-height:44px;border:0;border-bottom:3px solid var(--accent);border-radius:0;color:var(--ink2);
  text-align:center;padding:0 6px;margin:0 2px;font-size:inherit;vertical-align:baseline}
.blank.filled{color:var(--ink);background:var(--surface2);border-radius:8px 8px 0 0}
.blank.good{border-color:var(--ok);color:var(--ok)}
.blank.wrong{border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.chipbtn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 14px;font-size:17px}
.chipbtn[disabled]{opacity:.3}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;padding:11px 14px;font-size:17px;min-height:52px}
.opt.good{border-color:var(--ok);background:rgba(30,122,69,.12)}
.opt.wrong{border-color:var(--warn);background:rgba(179,54,44,.12)}
.opt[disabled]{opacity:1}
.opt[disabled]:not(.good):not(.wrong){opacity:.5}
.ansrow{display:flex;gap:8px;margin:14px 0 6px}
.ansrow button{flex:1;border:2px solid currentColor;border-radius:14px;background:var(--surface);font-family:var(--font-d);font-size:21px;padding:12px 4px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.fb.ok{background:rgba(30,122,69,.12);border:1px solid var(--ok)}
.fb.bad{background:rgba(179,54,44,.12);border:1px solid var(--warn)}
.primary{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;font-family:var(--font-d);font-size:18px;padding:12px;margin:12px 0 2px}
.ghost{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-family:var(--font-d);font-size:17px;padding:11px;margin:8px 0 2px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- 시트 (결과 · 사용법) · 알림 ---------- */
.sheetwrap{position:fixed;inset:0;background:rgba(15,17,22,.55);display:grid;place-items:end center;z-index:20;
  padding:16px 16px calc(20px + var(--safe-b))}
.sheet{width:100%;max-width:528px;max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px}
.sheet h3{font-family:var(--font-d);font-size:22px;font-weight:400;margin:0 0 4px}
.sheet .stars{font-size:26px}
.xpline{font-size:17px;margin:8px 0 2px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow button{flex:1;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));z-index:30;max-width:min(520px,calc(100vw - 32px));
  background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14.5px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- 데이터 ---------- */
/* 뜻과 설명은 한국어(ko)와 영어(en) 둘 다 있어요. 독일어 문장은 모두 사람이 확인한 것만 넣어요. */
const TOPICS=['기초','인사','숫자','가족','음식','집','시간','일상','여행'];
const TOPIC_EN={'기초':'Basics','인사':'Greetings','숫자':'Numbers','가족':'Family','음식':'Food','집':'Home','시간':'Time','일상':'Daily life','여행':'Travel'};
const PHONICS=[
 {id:'p1',de:'ä',ko:'"에" 소리. 입을 조금 더 벌려요',en:'like the e in "bed"',
  words:[{de:'Käse',ko:'치즈',en:'cheese'},{de:'Mädchen',ko:'소녀',en:'girl'},{de:'Äpfel',ko:'사과들',en:'apples'}]},
 {id:'p2',de:'ö',ko:'"에"를 말하면서 입술을 "오"처럼 둥글게',en:'say "eh" with rounded lips, like British "bird"',
  words:[{de:'schön',ko:'아름다운',en:'beautiful'},{de:'Brötchen',ko:'작은 빵',en:'bread roll'},{de:'zwölf',ko:'12',en:'twelve'}]},
 {id:'p3',de:'ü',ko:'"이"를 말하면서 입술을 "우"처럼 둥글게 ("위"와 비슷)',en:'say "ee" with rounded lips',
  words:[{de:'fünf',ko:'5',en:'five'},{de:'Tschüss',ko:'잘 가',en:'bye'},{de:'über',ko:'~ 위에',en:'over, above'}]},
 {id:'p4',de:'ß',ko:'"ㅆ" 소리 (ss와 같아요). 단어 첫머리에는 안 써요',en:'a sharp "s", same as ss; never at the start of a word',
  words:[{de:'Straße',ko:'거리',en:'street'},{de:'heißen',ko:'~라고 불리다',en:'to be called'},{de:'weiß',ko:'하얀',en:'white'}]},
 {id:'p5',de:'ei · ie',ko:'ei = "아이", ie = 긴 "이"',en:'ei = "eye", ie = "ee"',
  words:[{de:'nein',ko:'아니요',en:'no'},{de:'drei',ko:'3',en:'three'},{de:'Liebe',ko:'사랑',en:'love'},{de:'sieben',ko:'7',en:'seven'}]},
 {id:'p6',de:'eu · äu',ko:'둘 다 "오이"',en:'both sound like "oy" in "boy"',
  words:[{de:'neun',ko:'9',en:'nine'},{de:'Freund',ko:'친구',en:'friend'},{de:'Häuser',ko:'집들',en:'houses'}]},
 {id:'p7',de:'au',ko:'"아우"',en:'like "ow" in "now"',
  words:[{de:'Haus',ko:'집',en:'house'},{de:'Frau',ko:'여자',en:'woman'},{de:'Auto',ko:'자동차',en:'car'}]},
 {id:'p8',de:'sch · sp · st',ko:'sch = "슈" (영어 sh). 단어 첫머리의 sp, st는 "슈프", "슈트"',en:'sch = English "sh". At the start of a word, sp and st sound like "shp" and "sht"',
  words:[{de:'Schule',ko:'학교',en:'school'},{de:'sprechen',ko:'말하다',en:'to speak'},{de:'Stuhl',ko:'의자',en:'chair'}]},
 {id:'p9',de:'ch',ko:'i, e 뒤에서는 부드러운 "히" (ich), a, o, u 뒤에서는 목에서 긁는 "흐" (acht)',en:'after i or e: a soft hiss, like the h in "huge" (ich). After a, o, u: throaty, like Scottish "loch" (acht)',
  words:[{de:'ich',ko:'나',en:'I'},{de:'Milch',ko:'우유',en:'milk'},{de:'acht',ko:'8',en:'eight'},{de:'Buch',ko:'책',en:'book'}]},
 {id:'p10',de:'w · v',ko:'w는 영어 v 소리 (Wasser ≈ 바서). v는 대개 영어 f 소리 (Vater ≈ 파터)',en:'w = English "v" (Wasser = "VAH-ser"). v = usually English "f" (Vater = "FAH-ter")',
  words:[{de:'Wasser',ko:'물',en:'water'},{de:'Wein',ko:'와인',en:'wine'},{de:'Vater',ko:'아버지',en:'father'},{de:'vier',ko:'4',en:'four'}]},
 {id:'p11',de:'z',ko:'"츠" 소리 (Zeit ≈ 차이트)',en:'"ts", as in "cats"',
  words:[{de:'Zeit',ko:'시간',en:'time'},{de:'zehn',ko:'10',en:'ten'},{de:'Zug',ko:'기차',en:'train'}]},
 {id:'p12',de:'s',ko:'모음 앞의 s는 영어 z 소리 (Suppe ≈ 주페). 단어 끝에서는 "ㅅ"',en:'before a vowel, s sounds like English "z". At the end of a word it is a plain "s"',
  words:[{de:'Suppe',ko:'수프',en:'soup'},{de:'sieben',ko:'7',en:'seven'},{de:'Bus',ko:'버스',en:'bus'}]},
 {id:'p13',de:'j',ko:'영어 y 소리 (ja ≈ 야)',en:'like English "y" in "yes"',
  words:[{de:'ja',ko:'네',en:'yes'},{de:'Jahr',ko:'해, 년',en:'year'}]},
 {id:'p14',de:'r · -er',ko:'r은 목 안쪽에서 내요. 단어 끝의 -er은 약한 "아" (Butter ≈ 부타)',en:'r is made at the back of the throat. A final -er is a weak "uh" (Butter = "BUT-uh")',
  words:[{de:'rot',ko:'빨간',en:'red'},{de:'Reis',ko:'쌀, 밥',en:'rice'},{de:'Butter',ko:'버터',en:'butter'}]},
 {id:'p15',de:'모음 + h',ko:'모음 뒤의 h는 소리가 없고 앞 모음을 길게 해요',en:'h after a vowel is silent and makes the vowel long',
  words:[{de:'zehn',ko:'10',en:'ten'},{de:'Uhr',ko:'시계',en:'clock'},{de:'Stuhl',ko:'의자',en:'chair'}]},
 {id:'p16',de:'-ig · 끝의 b d g',ko:'끝의 -ig는 "이히" (zwanzig). 단어 끝의 b, d, g는 p, t, k처럼 (Tag ≈ 타크)',en:'final -ig = "ich" (zwanzig). Final b, d, g sound like p, t, k (Tag = "tahk")',
  words:[{de:'zwanzig',ko:'20',en:'twenty'},{de:'Tag',ko:'날',en:'day'},{de:'Abend',ko:'저녁',en:'evening'}]}
];
const NOTES=[
 {id:'n1',ko:'명사에는 성이 있어요',en:'Nouns have a gender',
  p:[{ko:'독일어 명사는 모두 der (남성), die (여성), das (중성) 중 하나예요. 뜻으로는 알 수 없으니 단어를 외울 때 관사까지 함께 외워요.',
      en:'Every German noun is der (masculine), die (feminine) or das (neuter). You cannot guess it from the meaning, so learn each noun together with its article.'},

/* 녹음 파일 이름: 읽을 글의 FNV-1a(UTF-8) 16진수 8자리. dev/make_clips.py 가 같은 식으로 만들어요. */
function sayText(t){return String(t||'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();}
function akey(t){
  const b=new TextEncoder().encode(sayText(t));let h=0x811c9dc5;
  for(let i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,0x01000193)>>>0;}
  return ('0000000'+h.toString(16)).slice(-8);}
/* 앱이 소리 내어 읽는 모든 글 (녹음 만들 때 dev/audio_texts.js 가 불러요) */
function allSpeech(){
  const set=new Set();const add=t=>{t=sayText(t);if(t)set.add(t);};
  PHONICS.forEach(p=>p.words.forEach(x=>add(x.de)));
  NOTES.forEach(n=>n.ex.forEach(x=>add(x.de)));
  WORDS.forEach(w=>{add(w.de);if(w.pl)add(w.pl);add(w.ex);});
  return Array.from(set);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(day,n){const p=day.split('-').map(Number);return todayStr(new Date(p[0],p[1]-1,p[2]+n));}
function dayDiff(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}

const KEY='deutsch-v1';
function blank(){return {xp:0,streak:0,lastDay:null,today:{day:null,games:0},items:{},log:[],diff:1,sound:true,lang:'both',seen:{},topic:'기초',updatedAt:0};}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const o=JSON.parse(r);
      if(o&&typeof o==='object'&&!Array.isArray(o)){
        const s=Object.assign(blank(),o);
        if(!s.items||typeof s.items!=='object'||Array.isArray(s.items))s.items={};
        for(const k of Object.keys(s.items)){const it=s.items[k];
          if(!it||typeof it!=='object'||!byId(Number(k))){delete s.items[k];continue;}
          if(typeof it.box!=='number'||it.box<0||it.box>5)it.box=0;
          if(typeof it.due!=='string')it.due='';
          if(typeof it.n!=='number')it.n=0;}
        if(!s.today||typeof s.today!=='object')s.today={day:null,games:0};
        if(typeof s.today.games!=='number')s.today.games=0;
        if(!Array.isArray(s.log))s.log=[];
        if(!s.seen||typeof s.seen!=='object')s.seen={};
        if(s.phonicsSeen&&typeof s.phonicsSeen==='object'){Object.assign(s.seen,s.phonicsSeen);delete s.phonicsSeen;}
        if(!TOPICS.includes(s.topic))s.topic='기초';
        if(![1,2,3].includes(s.diff))s.diff=1;
        if(!['both','ko','en'].includes(s.lang))s.lang='both';
        if(typeof s.xp!=='number'||!(s.xp>=0))s.xp=0;
        if(typeof s.streak!=='number'||!(s.streak>=0))s.streak=0;
        if(typeof s.sound!=='boolean')s.sound=true;
        return s;
      }
    }
  }catch(e){/* 깨진 저장 데이터 → 새로 시작 */}
  return blank();
}

/* LV_AT[L-1] = 레벨 L이 되는 XP. 10레벨 뒤로는 한 단계마다 100 XP씩 더 필요해요. */
const LV_AT=(function(){const a=[0,120,300,550,900,1350,1900,2600,3400,4300];let step=1000;
  while(a.length<40){a.push(a[a.length-1]+step);step+=100;}return a;})();
const LV_TITLES=[null,
 'Anfänger 새내기','Hamburg 항구','Berlin 큰 도시','Köln 대성당','Rhein 강가','Heidelberg 성',
 'München 광장','Alpen 산길','Wien 카페','Zürich 호수','Frankfurt 빌딩 숲','Neuschwanstein 성',
 'Dresden 옛 시가지','Leipzig 음악의 도시','Schwarzwald 검은 숲','Bodensee 호수','Salzburg 모차르트의 도시',
 'Bern 시계탑','Lübeck 항구의 문','Brandenburger Tor 문'];
function lvl(xp){let L=1;while(L<LV_AT.length&&xp>=LV_AT[L])L++;return L;}
function lvlInfo(xp){const L=lvl(xp),lo=LV_AT[L-1],hi=LV_AT[L];
  return {L:L,need:hi===undefined?0:hi-xp,pct:hi===undefined?100:Math.max(0,Math.min(100,Math.round((xp-lo)/(hi-lo)*100)))};}
function lvlTitle(L){return LV_TITLES[L]||'Deutschland 여행자';}

function touchStreak(){const t=todayStr();if(S.lastDay===t)return;
  S.streak=(S.lastDay&&dayDiff(S.lastDay,t)===1)?(S.streak||0)+1:1;S.lastDay=t;save();}
function curStreak(){if(!S.lastDay)return 0;const d=dayDiff(S.lastDay,todayStr());return (d===0||d===1)?(S.streak||0):0;}
/* 복습 상자 0~5, 간격 0·1·2·4·8·16일. 맞히면 하루에 한 칸만 올라가고, 틀리면 상자 0(오늘 다시). */
const BOX_DAYS=[0,1,2,4,8,16];
function grade(w,ok){const it=item(w.id),t=todayStr();
  it.n=(it.n||0)+1;it.last=Date.now();
  if(ok){it.c=(it.c||0)+1;
    if(it.up!==t){it.box=Math.min(5,(it.box||0)+1);it.up=t;}
    it.due=addDays(t,BOX_DAYS[it.box]);}
  else{it.box=0;it.up='';it.due=t;it.miss=(it.miss||0)+1;}
  save();}
function isDue(id){const it=S.items[id];return !!(it&&it.n>0&&it.due<=todayStr());}

/* 읽어 주기: 녹음(audio/<key>.mp3)이 있으면 그것을, 없으면 기기에서 가장 좋은 독일어 음성을 써요. */
let ac=null;
function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();
  if(ac.state==='suspended'&&ac.resume)ac.resume();}catch(e){}}
function tone(f,t0,d,type,g){const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  gn.gain.setValueAtTime(g||.08,ac.currentTime+t0);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+d);
  o.connect(gn);gn.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.03);}
function sfx(k){if(!S.sound||!ac)return;try{
  if(k==='ok'){tone(660,0,.12);tone(990,.07,.16);}
  else if(k==='bad'){tone(170,0,.24,'triangle',.12);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28));}
}catch(e){}}
const canSpeak=(typeof window!=='undefined')&&('speechSynthesis' in window);
let player=null,audioOff=(typeof Audio==='undefined'),audioHit=0,audioMiss=0,warnedVoice=false;
function deVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang||''));
  /* 새 신경망 음성(Google, Natural, Premium, Enhanced)이 기본 음성보다 훨씬 자연스러워요 */
  const score=v=>(/premium|enhanced|natural|neural|google|siri/i.test(v.name||'')?4:0)+(/^de[-_]DE/i.test(v.lang)?2:0)+(v.localService?0:1);
  return vs.sort((a,b)=>score(b)-score(a))[0]||null;}
function tts(t){
  if(!canSpeak){noVoice();return;}
  try{
    const all=speechSynthesis.getVoices(),v=deVoice();
    if(all.length&&!v){noVoice();return;}   /* 다른 언어 음성으로 독일어를 읽히지 않아요 */
    const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.88;if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}}
function noVoice(){if(warnedVoice)return;warnedVoice=true;
  toast('이 기기에는 독일어 음성이 없어요. 녹음 파일(audio 폴더)이 있는 곳에서 열면 소리가 나요.');}
function stopSay(){try{if(player){player.pause();player=null;}if(canSpeak)speechSynthesis.cancel();}catch(e){}}
function say(text){
  const t=sayText(text);if(!t)return;
  stopSay();
  if(audioOff){tts(t);return;}
  let a;try{a=new Audio('audio/'+akey(t)+'.mp3');}catch(e){audioOff=true;tts(t);return;}
  player=a;let settled=false;
  const miss=()=>{if(settled)return;settled=true;if(player===a)player=null;
    if(!audioHit&&++audioMiss>=3)audioOff=true;   /* 녹음이 아예 없는 곳: 그 뒤로는 바로 기기 음성 */
    tts(t);};
  a.addEventListener('error',miss);
  a.addEventListener('playing',()=>{settled=true;audioHit++;});
  try{const p=a.play();
    if(p&&p.catch)p.catch(e=>{const n=e&&e.name;if(n==='AbortError'||n==='NotAllowedError'){settled=true;return;}miss();});
  }catch(e){miss();}}
function autoSay(text){if(S.sound)say(text);}   /* 소리 끄기 = 효과음과 자동 읽기 끄기. 듣기 버튼은 항상 돼요 */

  switch(view.name){
    case 'word':  body=wordView(view.id);  title='단어'; break;
    case 'sound': body=soundView(view.id); title='기초 · 소리'; break;
    case 'note':  body=noteView(view.id);  title='기초 · 문법 메모'; break;
    case 'learn': body=learnView();        title='오늘 배우기'; break;
    case 'game':  body=gameView();         title=GAME_NAME[G.kind]; break;
    default:      body=homeView();
  }
  $('#app').innerHTML=header(title,view.name!=='home')+'<main>'+body+'</main>'
    +(G&&G.done?resultSheet():'')+(ui.tour!==null?tourView():'')
    +'<div id="live" class="sr" aria-live="polite"></div>';
  const af=$('#app [data-af]');
  if(af&&af.focus){try{af.focus({preventScroll:true});}catch(e){}}
}

function scopeWords(){return S.topic==='기초'?WORDS:WORDS.filter(w=>w.topic===S.topic);}
function scopeName(){return S.topic==='기초'?'전체':S.topic;}

/* 다음에 배울 새 단어: 고른 주제 먼저, 다 배웠으면 다음 주제 */
function nextNew(n){
  const order=(S.topic==='기초'?[]:[S.topic]).concat(TOPICS.filter(t=>t!=='기초'&&t!==S.topic));
  for(const t of order){const l=WORDS.filter(w=>w.topic===t&&!learned(w.id));if(l.length)return {topic:t,words:l.slice(0,n)};}
  return null;}
function heroCard(){
  const x=lvlInfo(S.xp),g=Math.min(3,S.today.games||0),n=learnedIn(WORDS).length;
  let h='<section class="hero" aria-label="나의 기록">';
  h+='<span class="muted">Lv '+x.L+'</span><h2>'+esc(lvlTitle(x.L))+'</h2>';
  h+='<div class="muted">'+(x.need?'다음 레벨까지 '+x.need+' XP':'가장 높은 레벨이에요')+'</div>';
  h+='<div class="bar"><i style="width:'+x.pct+'%"></i></div>';
  h+='<div class="stats"><div class="stat"><b>'+curStreak()+'</b><span>일 연속</span></div>'
    +'<div class="stat"><b>'+g+'<em>/3</em></b><span>오늘의 목표</span></div>'
    +'<div class="stat"><b>'+n+'<em>/'+WORDS.length+'</em></b><span>배운 단어</span></div></div>';

}

/* ---------- 오늘 배우기 (새 단어 카드 → 퀴즈) ---------- */
function learnStart(){
  const nx=nextNew(5);
  if(!nx){toast('모든 단어를 한 번씩 배웠어요.');return;}
  clearTimers();
  G={kind:'learn',phase:'cards',words:nx.words,topic:nx.topic,li:0,d:S.diff,q:[],i:0,ok:0,xp:0,miss:[],done:false,busy:false,cur:null,back:{name:'home'}};
  view={name:'learn'};render();window.scrollTo(0,0);autoSay(G.words[0].de);
}
function learnView(){
  const w=G.words[G.li],n=G.words.length,last=G.li===n-1;
  let h='<div class="qhead"><span class="tag">'+esc(G.topic)+' 새 단어</span><span class="tag">'+(G.li+1)+' / '+n+'</span></div>';
  h+='<article class="card pop">'+wordCard(w)+'</article>';
  h+='<button class="primary" data-af data-act="lnext">'+(last?'퀴즈 시작':'다음 단어')+'</button>';
  if(G.li)h+='<button class="ghost" data-act="lprev">이전 단어</button>';
  return h;
}
function learnQuiz(){
  /* 배운 다섯 단어를 독일어→뜻으로 한 번, 뜻→독일어로 한 번 */
  const a=shuffle(G.words).map(w=>({type:'mean',w:w,dir:'de2m'})),b=shuffle(G.words).map(w=>({type:'mean',w:w,dir:'m2de'}));
  G.phase='quiz';G.q=a.concat(b);G.i=0;view={name:'game'};nextRound(true);
}

/* ---------- 게임 공통 ---------- */
function newGame(kind,rounds,extra){
  clearTimers();
  G=Object.assign({kind:kind,d:S.diff,q:rounds,i:0,ok:0,xp:0,miss:[],done:false,busy:false,cur:null,back:{name:'home'}},extra||{});
  view={name:'game'};nextRound(true);
}
function nextRound(first){
  if(!first)G.i++;
  G.busy=false;
  if(G.i>=G.q.length){finishGame();return;}
  G.cur=makeRound(G.q[G.i]);
  render();window.scrollTo(0,0);
  if(G.cur.type==='mean'&&G.cur.dir==='de2m')autoSay(G.cur.w.de);
}
function makeRound(r){
  if(r.type==='mean')return meanMake(r.w,r.dir);
  if(r.type==='lueck')return lueckMake(r.w);
  return {type:'art',w:r.w,ans:null};
}
function gameHead(){
  return '<div class="qhead"><span class="tag">'+esc(GAME_NAME[G.kind])+'</span><span class="tag">'+(G.i+1)+' / '+G.q.length+'</span>'
    +'<span class="spacer"></span><span class="tag">'+esc(DIFF[G.d].name)+' ×'+DIFF[G.d].mult+'</span></div>'
    +'<div class="prog" aria-hidden="true"><i style="width:'+Math.round(G.i/G.q.length*100)+'%"></i></div>';
}
function gameView(){
  const c=G.cur;if(!c)return '';
  let h=gameHead()+'<article class="gcard pop">';
  h+=c.type==='mean'?meanView(c):c.type==='art'?artView(c):lueckView(c);
  return h+'</article>';
}
function settle(w,ok,pts){
  G.busy=true;
  if(ok){G.ok++;G.xp+=Math.round(pts*DIFF[G.d].mult);}
  else if(G.miss.indexOf(w.id)<0)G.miss.push(w.id);
  grade(w,ok);
  sfx(ok?'ok':'bad');
}
function afterHtml(w,sayWhat){
  /* 답을 고른 뒤: 예문, 도움말, 듣기, 다음 */
  return exHtml(w)+tipHtml(w)+'<div class="row">'+sayBtn(w.de,'단어 듣기')+sayBtn(w.ex,'예문 듣기')+'</div>'
    +'<button class="primary" data-af data-act="gnext">'+(G.i+1>=G.q.length?'결과 보기':'다음')+'</button>';
}
function finishGame(){
  const before=lvl(S.xp);
  G.done=true;G.cur=null;
  if(G.kind==='learn'){G.xp+=10;}
  if(S.today.games===0){G.xp+=20;G.firstBonus=true;}
  S.today.games++;
  S.xp+=Math.max(0,Math.round(G.xp));
  S.log.push({d:todayStr(),g:G.kind,ok:G.ok,t:G.q.length,x:G.xp,df:G.d});
  if(S.log.length>240)S.log=S.log.slice(-240);
  touchStreak();save();
  G.levelUp=lvl(S.xp)>before?lvl(S.xp):0;
  sfx('win');render();
  announce('끝났어요. '+G.q.length+'문제 중 '+G.ok+'개 정답, '+G.xp+' XP');
}
function resultSheet(){
  const rate=G.q.length?G.ok/G.q.length:0,stars=rate>=0.9?3:rate>=0.6?2:rate>=0.3?1:0;
  let h='<div class="sheetwrap"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="결과">';
  h+='<h3>'+(G.kind==='learn'?'새 단어 '+G.words.length+'개를 배웠어요!':rate>=0.9?'아주 잘했어요!':rate>=0.6?'잘했어요!':'한 번 더 해 봐요')+'</h3>';
  h+=starHtml(stars);
  h+='<div class="xpline">정답 '+G.ok+' / '+G.q.length+' · <b>+'+G.xp+' XP</b></div>';
  if(G.firstBonus)h+='<div class="tiny">오늘 첫 게임 보너스 +20 XP 포함</div>';
  if(G.levelUp)h+='<div class="fb ok">레벨 업! Lv '+G.levelUp+' · '+esc(lvlTitle(G.levelUp))+'</div>';
  if(G.kind==='learn')h+='<p class="tiny">이 단어들은 내일 <b>오늘 복습</b>에 다시 나와요.</p>';
  if(G.miss.length)h+='<div class="fb bad">다시 볼 단어<br>'+G.miss.map(id=>{const w=byId(id);return '<span lang="de">'+wordHtml(w)+'</span> — '+esc(mean(w));}).join('<br>')+'</div>';
  h+='<div class="btnrow"><button class="ghost" data-act="retry">'+(G.kind==='learn'?'다음 단어 배우기':'다시 하기')+'</button>'
    +'<button class="primary" data-af data-act="gdone">'+(G.kind==='one'?'단어로 돌아가기':'홈으로')+'</button></div></div></div>';
  return h;
}

/* ---------- 게임 0 · 뜻 맞히기 ---------- */
function meanMake(w,dir){
  dir=dir||(G.d===1?'de2m':G.d===2?pick(['de2m','m2de']):'m2de');
  const cls=x=>x.g?'n':x.pos;
  const cand=WORDS.filter(o=>o.id!==w.id&&o.ko!==w.ko&&o.en!==w.en)
    .map(o=>({o:o,s:(o.topic===w.topic?2:0)+(cls(o)===cls(w)?1.5:0)+(learned(o.id)?1:0)+Math.random()*2}))
    .sort((a,b)=>b.s-a.s).slice(0,DIFF[G.d].opts-1).map(x=>x.o);
  return {type:'mean',w:w,dir:dir,opts:shuffle([w].concat(cand)),ans:null};
}
function meanView(c){
  const w=c.w,de=c.dir==='de2m';
  let h='<div class="muted">'+(de?'이 단어의 뜻은?':'독일어로는?')+'</div>';
  h+=de?'<div class="qword" lang="de">'+wordHtml(w)+'</div><div class="row">'+sayBtn(w.de,'듣기')+'</div>'
       :'<div class="qmean">'+two(w.ko,w.en)+'</div>';
  h+='<div class="opts" role="group" aria-label="보기">';
  c.opts.forEach((o,i)=>{
    let cls='opt';
    if(G.busy){if(o.id===w.id)cls+=' good';else if(c.ans===i)cls+=' wrong';}
    h+='<button class="'+cls+'" data-act="opt" data-i="'+i+'"'+(G.busy?' disabled':'')+(de?'':' lang="de"')+'>'
      +(de?esc(mean(o)):wordHtml(o))+'</button>';
  });
  h+='</div>';
  if(G.busy){
    const ok=c.opts[c.ans].id===w.id;
    h+='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'정답! ':'아쉬워요. ')+'<span lang="de">'+wordHtml(w)+'</span> = '+esc(mean(w))+'</div>'+afterHtml(w);
  }
  return h;
}
function meanAnswer(i){
  const c=G.cur;if(!c.opts[i])return;
  c.ans=i;const ok=c.opts[i].id===c.w.id;
  settle(c.w,ok,10);
  announce((ok?'정답. ':'오답. ')+c.w.de+' = '+mean(c.w));
  render();
  if(c.dir==='m2de')autoSay(c.w.de);
}

/* ---------- 게임 4 · 관사 맞히기 ---------- */
function genderRule(w){
  const c=coreOf(w).toLowerCase();
  if(w.g==='f'&&/(ung|heit|keit|schaft|tion|tät)$/.test(c))return {ko:'-ung, -heit, -keit, -schaft, -tion으로 끝나는 명사는 항상 die예요.',en:'Nouns ending in -ung, -heit, -keit, -schaft, -tion are always die.'};
  if(w.g==='n'&&/(chen|lein)$/.test(c))return {ko:'-chen, -lein으로 끝나는 명사는 항상 das예요.',en:'Nouns ending in -chen or -lein are always das.'};
  if(w.g==='m'&&/^(montag|monat|tag|morgen|abend)$/.test(c))return {ko:'요일, 달, 하루의 때(아침 · 저녁)는 대부분 der예요. 밤(die Nacht)만 달라요.',en:'Days, months and times of day are mostly der. Only die Nacht is different.'};
  if(w.g==='f'&&/e$/.test(c))return {ko:'-e로 끝나는 명사는 대부분 die예요.',en:'Most nouns ending in -e are die.'};
  return null;
}
function artView(c){
  const w=c.w,rule=genderRule(w);
  let h='<div class="muted">der, die, das 중에서 고르세요</div>';
  h+='<div class="qword" lang="de">'+esc(coreOf(w))+'</div>';
  if(G.d<3||G.busy)h+='<div class="meanbig">'+two(w.ko,w.en)+'</div>';
  if(!G.busy){
    if(G.d===1&&rule)h+='<div class="tipbox">'+two('힌트: '+rule.ko,'Hint: '+rule.en)+'</div>';
    h+='<div class="ansrow" role="group" aria-label="관사 고르기">'
      +['m','f','n'].map(g=>'<button data-act="art" data-g="'+g+'" class="g-'+g+'" lang="de">'+ART[g]+'</button>').join('')+'</div>';
  }else{
    const ok=c.ans===w.g;
    h+='<div class="qword" style="font-size:26px;margin-top:10px" lang="de">'+wordHtml(w)+'</div>';
    if(w.pl)h+='<div class="muted" lang="de">복수: '+esc(w.pl)+'</div>';
    h+='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'정답! ':'아쉬워요. 고른 답: '+ART[c.ans]+'. ')+'<span lang="de">'+wordHtml(w)+'</span> ('
      +esc(S.lang==='en'?GEN[w.g].en:S.lang==='ko'?GEN[w.g].ko:GEN[w.g].ko+' · '+GEN[w.g].en)+')</div>';
    if(rule)h+='<div class="tipbox">'+two(rule.ko,rule.en)+'</div>';
    h+=afterHtml(w);
  }
  return h;
}
function artAnswer(g){
  const c=G.cur,w=c.w;if(!ART[g])return;
  c.ans=g;const ok=g===w.g;
  settle(w,ok,10);
  announce((ok?'정답. ':'오답. ')+w.de);
  render();autoSay(w.de);
}

/* ---------- 게임 1 · 빈칸 채우기 ---------- */
const LEAD_DASH='—…';        /* 문장 앞 줄표: 단어와 떨어뜨리되 화면에는 남긴다 */
const TRAIL_PUNCT=',.!?;:';  /* 문장 부호는 단어에 붙이지 않고 따로 보관 */
function sentParts(s){
  const parts=[];
  String(s).split(' ').forEach(tok=>{
    if(!tok)return;
    let lead='',trail='';
    while(tok.length&&LEAD_DASH.indexOf(tok[0])>=0){lead+=tok[0];tok=tok.slice(1);}
    while(tok.length&&TRAIL_PUNCT.indexOf(tok[tok.length-1])>=0){trail=tok[tok.length-1]+trail;tok=tok.slice(0,-1);}
    parts.push({w:tok,lead:lead,trail:trail});
  });
  return parts;}
/* 예문 안에서 그 단어(또는 그 단어의 변한 꼴)가 있는 자리 */
function targetIdx(w,parts){
  const cs=coreOf(w).toLowerCase().replace(/[?!.,]/g,'').split(' ');
  const out=[];
  parts.forEach((p,i)=>{const t=p.w.toLowerCase();if(!t)return;
    if(cs.some(c=>t===c||(c.length>3&&t.indexOf(c.slice(0,c.length-1))===0)))out.push(i);});
  return out;}
function sameCase(model,s){const up=model[0]!==model[0].toLowerCase();
  return up?s[0].toUpperCase()+s.slice(1):s;}
function lueckMake(w){
  const parts=sentParts(w.ex),words=parts.map((p,i)=>i).filter(i=>parts[i].w);
  const tg=targetIdx(w,parts).sort((a,b)=>parts[b].w.length-parts[a].w.length);
  const main=tg.length?tg[0]:words[words.length-1];
  const want=Math.max(1,Math.min(DIFF[G.d].blanks,words.length-1));
  const rest=tg.slice(1).concat(shuffle(words.filter(i=>i!==main&&tg.indexOf(i)<0&&i>0&&parts[i].w.length>2)));
  const idxs=[main].concat(rest.slice(0,want-1)).sort((a,b)=>a-b);
  const answers=idxs.map(i=>parts[i].w);
  /* 헷갈리는 칩: 빈칸의 단어와 같은 종류의 다른 단어 */
  const cls=x=>x.g?'n':x.pos,decoys=[];
  const has=t=>answers.concat(decoys).some(a=>a.toLowerCase()===t.toLowerCase());
  for(const o of shuffle(WORDS)){
    if(decoys.length>=DIFF[G.d].decoys)break;
    if(o.id===w.id||cls(o)!==cls(w))continue;
    const t=coreOf(o);
    if(t.indexOf(' ')>=0||t.length<2)continue;
    const d=w.g?t:sameCase(parts[main].w,t);
    if(!has(d))decoys.push(d);
  }
  for(const o of shuffle(WORDS)){
    if(decoys.length>=DIFF[G.d].decoys)break;
    for(const p of sentParts(o.ex)){
      if(decoys.length>=DIFF[G.d].decoys)break;
      if(p.w.length>2&&!has(p.w))decoys.push(p.w);
    }
  }
  return {type:'lueck',w:w,parts:parts,idxs:idxs,answers:answers,chips:shuffle(answers.concat(decoys)),fill:idxs.map(()=>-1),ok:null};
}
function lueckView(c){
  const w=c.w,full=c.fill.every(x=>x>=0);
  let h='<div class="muted">알맞은 단어를 눌러 빈칸을 채우세요. 채운 칸을 누르면 다시 빠져요.</div>';
  h+='<div class="qsent" lang="de">';
  c.parts.forEach((p,i)=>{
    const k=c.idxs.indexOf(i);
    if(k<0){h+=esc(p.lead+p.w+p.trail)+' ';return;}
    const ci=c.fill[k],txt=ci>=0?c.chips[ci]:'';
    let cls='blank';
    if(G.busy)cls+=(txt===c.answers[k]?' good':' wrong');else if(ci>=0)cls+=' filled';
    h+=esc(p.lead)+'<button class="'+cls+'" data-act="unfill" data-k="'+k+'"'+(G.busy||ci<0?' disabled':'')
      +' aria-label="빈칸 '+(k+1)+(txt?': '+esc(txt):'')+'">'+(txt?esc(txt):'&nbsp;')+'</button>'+esc(p.trail)+' ';
  });
  h+='</div><div class="meanbig">'+two(w.exKo,w.exEn)+'</div>';
  if(!G.busy){
    h+='<div class="chips" role="group" aria-label="단어 칩">';
    c.chips.forEach((t,ci)=>{h+='<button class="chipbtn" lang="de" data-act="chip" data-ci="'+ci+'"'+(c.fill.indexOf(ci)>=0?' disabled':'')+'>'+esc(t)+'</button>';});
    h+='</div><button class="primary" data-act="check"'+(full?' data-af':' disabled')+'>확인</button>';
  }else{
    h+='<div class="fb '+(c.ok?'ok':'bad')+'">'+(c.ok?'정답! ':'아쉬워요. 바른 문장: ')+'<span lang="de">'+esc(w.ex)+'</span></div>'
      +tipHtml(w)+'<div class="row">'+sayBtn(w.ex,'문장 듣기')+'</div>'
      +'<button class="primary" data-af data-act="gnext">'+(G.i+1>=G.q.length?'결과 보기':'다음')+'</button>';
  }
  return h;
}
function lueckChip(ci){
  const c=G.cur;if(!(ci>=0&&ci<c.chips.length)||c.fill.indexOf(ci)>=0)return;
  const k=c.fill.indexOf(-1);if(k<0)return;
  c.fill[k]=ci;render();
}
function lueckUnfill(k){const c=G.cur;if(c.fill[k]>=0){c.fill[k]=-1;render();}}
function lueckCheck(){
  const c=G.cur;if(!c.fill.every(x=>x>=0))return;
  c.ok=c.fill.every((ci,k)=>c.chips[ci]===c.answers[k]);
  settle(c.w,c.ok,15);
  announce(c.ok?'정답':'오답. '+c.w.ex);
  render();autoSay(c.w.ex);
}

/* ---------- 게임 시작 ---------- */
function needLearned(pool,min,what){
  if(pool.length>=min)return true;
  toast('먼저 "오늘 배우기"로 '+what+' '+min+'개 이상 배워요. ('+scopeName()+'에서 지금 '+pool.length+'개)');
  return false;}
function startMean(){const pool=learnedIn(scopeWords());
  if(needLearned(pool,4,'단어를'))newGame('mean',shuffle(pool).slice(0,8).map(w=>({type:'mean',w:w})));}
function startArt(){const pool=learnedIn(scopeWords()).filter(w=>w.g);
  if(needLearned(pool,3,'명사를'))newGame('art',shuffle(pool).slice(0,8).map(w=>({type:'art',w:w})));}
function startLueck(){const pool=learnedIn(scopeWords());
  if(needLearned(pool,3,'단어를'))newGame('lueck',shuffle(pool).slice(0,6).map(w=>({type:'lueck',w:w})));}
function startReview(){
  /* 오래 밀린 단어부터, 한 번에 10개. 명사는 뜻과 관사를 번갈아 물어요 */
  const due=shuffle(dueWords()).sort((a,b)=>S.items[a.id].due<S.items[b.id].due?-1:S.items[a.id].due>S.items[b.id].due?1:0).slice(0,10);
  if(!due.length){toast('오늘 복습할 단어가 없어요.');return;}
  newGame('review',shuffle(due).map(w=>{
    const kinds=['mean'].concat(w.g?['art']:[]).concat(S.diff>=2?['lueck']:[]);
    return {type:pick(kinds),w:w};}));
}
function startOne(id){
  const w=byId(id);if(!w)return;
  newGame('one',[{type:'mean',w:w}].concat(w.g?[{type:'art',w:w}]:[]).concat([{type:'lueck',w:w}]),{back:{name:'word',id:w.id}});
}
function retry(){
  const k=G.kind,back=G.back;
  if(k==='learn')learnStart();
  else if(k==='mean')startMean();
  else if(k==='art')startArt();
  else if(k==='lueck')startLueck();
  else if(k==='review'){if(dueWords().length)startReview();else go({name:'home'});}
  else if(k==='one')startOne(back.id);
  if(G&&G.done)go({name:'home'});   /* 다시 시작하지 못했으면 홈으로 */
}

/* ---------- 이벤트 ---------- */
$('#app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  unlockAudio();
  const d=el.dataset,inGame=G&&!G.done&&view.name==='game';
  switch(d.act){
    case 'sound': S.sound=!S.sound;save();if(!S.sound)stopSay();render();announce('효과음과 자동 읽기 '+(S.sound?'켜짐':'꺼짐'));break;
    case 'topic': if(TOPICS.includes(d.topic)){S.topic=d.topic;save();render();}break;
    case 'diff':{const n=Number(d.diff);if(DIFF[n]){S.diff=n;save();render();announce('난이도 '+DIFF[n].name);}break;}
    case 'lang': if(['both','ko','en'].includes(d.lang)){S.lang=d.lang;save();render();}break;
    case 'openw': go({name:'word',id:Number(d.id),from:view.name==='home'?null:view});break;
    case 'opens': go({name:'sound',id:d.id});break;
    case 'openn': go({name:'note',id:d.id});break;
    case 'say': say(d.text||'');break;
    case 'back': go(G&&G.back&&view.name!=='learn'?G.back:{name:'home'});break;
    case 'learn': learnStart();break;
    case 'lnext': if(G&&G.kind==='learn'&&G.phase==='cards'){
        if(G.li<G.words.length-1){G.li++;render();window.scrollTo(0,0);autoSay(G.words[G.li].de);}else learnQuiz();}break;
    case 'lprev': if(G&&G.kind==='learn'&&G.phase==='cards'&&G.li>0){G.li--;render();window.scrollTo(0,0);}break;
    case 'review': startReview();break;
    case 'gmean': startMean();break;
    case 'gart': startArt();break;
    case 'glueck': startLueck();break;
    case 'one': startOne(Number(d.id));break;
    case 'opt': if(inGame&&!G.busy&&G.cur.type==='mean')meanAnswer(Number(d.i));break;
    case 'art': if(inGame&&!G.busy&&G.cur.type==='art')artAnswer(d.g);break;
    case 'chip': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckChip(Number(d.ci));break;
    case 'unfill': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckUnfill(Number(d.k));break;
    case 'check': if(inGame&&!G.busy&&G.cur.type==='lueck')lueckCheck();break;
    case 'gnext': if(inGame&&G.busy){stopSay();nextRound(false);}break;
    case 'retry': if(G&&G.done)retry();break;
    case 'gdone': go(G&&G.kind==='one'&&G.back?G.back:{name:'home'});break;
    case 'tourOpen': ui.tour=0;render();break;
    case 'tourNext': ui.tour=Math.min(TOUR.length-1,(ui.tour||0)+1);render();break;
    case 'tourPrev': ui.tour=Math.max(0,(ui.tour||0)-1);render();break;
    case 'tourClose': ui.tour=null;try{localStorage.setItem(TOUR_KEY,'1');}catch(e){}render();break;
    case 'reset': ui.confirmReset=true;render();break;
    case 'resetNo': ui.confirmReset=false;render();break;
    case 'resetYes': S=blank();save();go({name:'home'});toast('진도를 지웠어요.');break;
    default: break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(ui.tour!==null){ui.tour=null;try{localStorage.setItem(TOUR_KEY,'1');}catch(x){}render();}
  else if(view.name!=='home')go(G&&G.back&&view.name!=='learn'?G.back:{name:'home'});
});

/* ---------- 시작 ---------- */
if(!tourSeen())ui.tour=0;
render();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
